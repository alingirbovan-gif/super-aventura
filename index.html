}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  roundRect(12, 12, 1000, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px "Segoe UI", Arial';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('⭐ ' + score, 28, 39);
  ctx.fillText('❤️'.repeat(Math.max(0, lives)), 160, 39);
  ctx.textAlign = 'center';
  ctx.fillText(LEVELS[Math.min(levelIdx, LEVELS.length-1)].name, W/2 + 20, 39);
  ctx.textAlign = 'right';
  let px = W - 28;
  ctx.fillText((CHARACTERS[charIdx].emoji || '🧒') + ' ' + CHARACTERS[charIdx].name, px, 39);
  px -= 180;
  if (player && player.starT > 0) { ctx.fillText('⭐' + Math.ceil(player.starT), px, 39); px -= 70; }
  if (player && player.wingsT > 0) { ctx.fillText('🪽' + Math.ceil(player.wingsT), px, 39); px -= 70; }
  if (player && player.fire) { ctx.fillText('🔥', px, 39); }
  btnFEl.style.display = (document.body.classList.contains('touch') && player && player.fire && state === 'play') ? 'flex' : 'none';

  if (player && (player.starT > 0 || player.wingsT > 0)) {   // numărătoare mare, centrală, pentru super puteri
    const activeT = player.starT > 0 ? player.starT : player.wingsT;
    const icon = player.starT > 0 ? '⭐' : '🪽';
    const pulse = 1 + Math.sin(time*8) * 0.08;
    ctx.save();
    ctx.translate(W/2, 92);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    roundRect(-48, -24, 96, 44, 14); ctx.fill();
    ctx.fillStyle = player.starT > 0 ? '#ffd700' : '#fff';
    ctx.font = 'bold 30px "Segoe UI", Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icon + ' ' + Math.ceil(activeT), 0, 0);
    ctx.restore();
  }
}

  ctx.font = 'bold 44px "Segoe UI", Arial';
  ctx.fillStyle = '#ffd700';
  ctx.fillText(bossEmoji(boss ? boss.kind : 'balaur') + ' ' + bossTitle() + ' te așteaptă!', W/2, 80);
  ctx.font = '30px "Segoe UI", Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Cine vine să te ajute? 🤝', W/2, 140);

  for (let i = 0; i < 2; i++) {
    const cfg = HELPERS[i];
    const bx = i === 0 ? W/4 : 3*W/4;
    const sel = selHelperHover === i;
    ctx.fillStyle = sel ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)';
    roundRect(bx - 150, 180, 300, 300, 24); ctx.fill();
    if (sel) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6;
      roundRect(bx - 150, 180, 300, 300, 24); ctx.stroke();
    }
    const bob = sel ? Math.sin(time*5)*5 : 0;
    drawKidOnFoot(bx, 440 + bob, cfg, 150 * cfg.scale / 1.25, 1, sel ? time*6 : 0, false);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 32px "Segoe UI", Arial';
    ctx.fillText(cfg.emoji + ' ' + cfg.name, bx, 225);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '24px "Segoe UI", Arial';
  ctx.fillText('⬅➡ alege  •  Enter / atinge cardul', W/2, 530);
}

function drawBossVictory() {
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (stateTimer < 4) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px "Segoe UI", Arial';
    ctx.fillText('AȚI ÎNVINS BOSSUL FINAL! 🐉💥', W/2, H/2 - 20);
    ctx.font = '30px "Segoe UI", Arial';
    ctx.fillText('Echipă de aur! ⭐', W/2, H/2 + 40);
  } else {
    const antonia = charIdx === 0;
    if (antonia) drawRabbit(W/2, H/2 - 70, 2.3);
    else drawWashingMachine(W/2, H/2 - 70, 2.3, time*2, true);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px "Segoe UI", Arial';
    ctx.fillText('Bravo, ' + CHARACTERS[charIdx].name + '!', W/2, H/2 + 150);
    ctx.font = '23px "Segoe UI", Arial';
    ctx.fillText('Ai reușit să ajungi la bossul final și să salvezi', W/2, H/2 + 186);
    ctx.fillText(antonia ? 'un iepuraș uriaș! 🐰✨' : 'o mașină de spălat fericită! 🧺😊', W/2, H/2 + 216);
  }
}

function drawWin() {
  ctx.fillStyle = 'rgba(20,10,60,.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 60px "Segoe UI", Arial';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('🏆 AI CÂȘTIGAT! 🏆', W/2, H/2 - 100);
  ctx.font = 'bold 38px "Segoe UI", Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Scor final: ⭐ ' + score, W/2, H/2 - 20);
  const rec = loadRecords()[CHARACTERS[charIdx].name] || 0;
  ctx.font = '28px "Segoe UI", Arial';
  ctx.fillText(score >= rec ? '🎉 RECORD NOU! 🎉' : '🏆 Recordul tău: ' + rec, W/2, H/2 + 35);
  if (stateTimer > 1) ctx.fillText('Apasă Enter (sau atinge ecranul) pentru a juca din nou', W/2, H/2 + 95);
  for (let i = 0; i < 40; i++) {
    const x = (i * 137 + time * (60 + i*7)) % W;
    const y = (i * 211 + time * (120 + i*13)) % H;
    ctx.fillStyle = ['#e63946','#ffd700','#2a9d8f','#a06cd5','#ff9f1c'][i%5];
    ctx.fillRect(x, y, 10, 10);
  }
}

function drawSelect() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 58px "Segoe UI", Arial';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 8;
  ctx.strokeText('🍄 Super Aventura 🍄', W/2, 90);
  ctx.fillText('🍄 Super Aventura 🍄', W/2, 90);
  ctx.font = '30px "Segoe UI", Arial';
  ctx.fillText('Cine se joacă? 😊', W/2, 155);

  const rec = loadRecords();
  for (let i = 0; i < 2; i++) {
    const cfg = CHARACTERS[i];
    const bx = i === 0 ? W/4 : 3*W/4;
    const sel = selHover === i;
    ctx.fillStyle = sel ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.55)';
    roundRect(bx - 160, 190, 320, 300, 24); ctx.fill();
    if (sel) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6;
      roundRect(bx - 160, 190, 320, 300, 24); ctx.stroke();
    }
    const bob = sel ? Math.sin(time*5)*5 : 0;
    drawKid(bx, 425 + bob, cfg, 125 * cfg.scale, 1, sel ? time*6 : 0, false, false);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 30px "Segoe UI", Arial';
    ctx.fillText(cfg.name, bx, 235);
    ctx.font = 'bold 22px "Segoe UI", Arial';
    ctx.fillStyle = '#8a6a10';
    ctx.fillText('🏆 Record: ' + (rec[cfg.name] || 0), bx, 465);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '24px "Segoe UI", Arial';
  ctx.fillText('⬅➡ alege  •  Enter / atinge ca să pornești', W/2, 530);
  ctx.fillText('🕹️ Săgeți sau A/D = mers  •  Spațiu / ⬆ = săritură / zbor / înot', W/2, 30);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ================= BUCLA ================= */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
