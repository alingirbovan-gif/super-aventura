/* ================= SUNETE (WebAudio) ================= */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(freq, dur, type='square', vol=0.15, slide=0) {
  try {
    const ac = audio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}

/* ================= MUZICĂ 8-BIT (melodie originală) ================= */
const MAIN_MELODY = [72,76,79,76, 72,76,79,76, 74,77,81,77, 74,77,81,77,
                    76,79,83,79, 84,83,81,79, 77,76,74,76, 72,0,67,0];
const MAIN_BASS   = [48,0,55,0, 48,0,55,0, 50,0,57,0, 50,0,57,0,
                     52,0,59,0, 48,0,55,0, 53,0,55,0, 48,0,48,0];
const BOSS_MELODY = [69,0,69,72, 69,76,75,72, 77,76,72,69, 71,71,64,0];
const BOSS_BASS   = [45,45,57,45, 45,45,57,45, 41,41,53,41, 43,43,55,43];
const THEME_MUSIC = {
  campie:   { trans: 0,  tempo: 1.0,  boss: false },
  subteran: { trans: -5, tempo: 0.92, boss: false },
  apa:      { trans: -3, tempo: 0.8,  boss: false },
  nori:     { trans: 4,  tempo: 1.05, boss: false },
  boss:     { trans: 0,  tempo: 1.25, boss: true },
};
let musicMuted = false;
try { musicMuted = localStorage.getItem('sa_mute') === '1'; } catch(e){}
let musicCfg = null, musicStep = 0, musicNextT = 0, musicTimer = null;
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function musicNote(m, t, dur, type, vol) {
  try {
    const ac = audio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(midiFreq(m), t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}
function startMusic(theme) {
  musicCfg = THEME_MUSIC[theme] || THEME_MUSIC.campie;
  musicStep = 0;
  try { musicNextT = audio().currentTime + 0.1; } catch(e){ musicCfg = null; return; }
  if (!musicTimer) musicTimer = setInterval(musicTick, 40);
}
function stopMusic() { musicCfg = null; }
function musicTick() {
  if (!musicCfg || musicMuted || !AC) return;
  try {
    const stepDur = (60 / 140 / 2) / musicCfg.tempo;
    const mel = musicCfg.boss ? BOSS_MELODY : MAIN_MELODY;
    const bas = musicCfg.boss ? BOSS_BASS : MAIN_BASS;
    while (musicNextT < AC.currentTime + 0.15) {
      if (musicNextT < AC.currentTime - 0.5) musicNextT = AC.currentTime + 0.05;
      const i = musicStep % mel.length;
      if (mel[i]) musicNote(mel[i] + musicCfg.trans, musicNextT, stepDur * 0.85, 'square', 0.038);
      if (bas[i]) musicNote(bas[i] + musicCfg.trans, musicNextT, stepDur * 1.6, 'triangle', 0.05);
      musicNextT += stepDur;
      musicStep++;
    }
  } catch(e){}
}

/* ================= FULLSCREEN ================= */
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const inFs = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (!inFs) {
      const p = el.requestFullscreen ? el.requestFullscreen()
              : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null;
      if (p && p.catch) p.catch(()=>{});
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
    } else {
      const p = d.exitFullscreen ? d.exitFullscreen()
              : d.webkitExitFullscreen ? d.webkitExitFullscreen() : null;
      if (p && p.catch) p.catch(()=>{});
    }
  } catch(e){}
}
const btnFSEl = document.getElementById('btnFS');
btnFSEl.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });

  btnFSEl.textContent = document.fullscreenElement ? '🡴' : '⛶';

function activateTestGodMode() {

  if (charIdx !== 0 && charIdx !== 1) charIdx = 0;
  lives = LIVES_START;

  loadLevel(levelIdx);

  stopMusic(); sfx.win();

}

    const r = loadRecords();

/* ================= STARE JOC ================= */
let state = 'select';   // select | play | helper | dead | levelend | bossdead | win
let charIdx = 0;
let helperIdx = 0;
let levelIdx = 0;
let grid = [];
let levelW = 0;
let theme = 'campie';
let player = null;
let helper = null;
let boss = null;
let enemies = [];
let coins = [];
let powerups = [];
let particles = [];
let flyCoins = [];      // monedele care zboară spre scor după ce sunt luate ⭐
let camX = 0;
let score = 0;
let lives = LIVES_START;
let time = 0;
let stateTimer = 0;
let flagX = 0;
let selHover = 0;
let selHelperHover = 0;
let levelSpawn = { x: 96, y: 480 };
let carryBig = false;      // rămâi mare între niveluri (pierzi la moarte)
let carryFire = false;     // a doua înghețată = bile de foc 🔥
let fireballs = [];
let fireCd = 0;
let glasses = [];      // ochelarii aruncați de Deni spre boss 👓
let checkpoints = [];   // puncte de salvare pe parcursul nivelului 🚩
let bubbles = [];        // bulițe în urma jucătorului cât înoată 🫧

/* ================= INPUT ================= */
const keys = {};
let jumpBufferT = 0;
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  if (!keys[k] && (k===' '||k==='arrowup'||k==='w')) jumpBufferT = JUMP_BUFFER;
  if (!keys[k] && (k==='x'||k==='control')) shootFireball();   // X sau Ctrl = bilă de foc
  keys[k] = true;
  handleMenuKey(e.key);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function inputLeft()  { return keys['arrowleft'] || keys['a'] || touchState.L; }
function inputRight() { return keys['arrowright'] || keys['d'] || touchState.R; }
function inputJumpHeld() { return keys[' '] || keys['arrowup'] || keys['w'] || touchState.J; }

const touchState = { L:false, R:false, J:false };
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
addEventListener('pointerdown', e => { if (e.pointerType === 'touch') document.body.classList.add('touch'); }, true);
function bindBtn(id, down, up) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); el.classList.add('pressed'); down(); };
  const off = e => { e.preventDefault(); el.classList.remove('pressed'); up(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindBtn('btnL', ()=>touchState.L=true, ()=>touchState.L=false);
bindBtn('btnR', ()=>touchState.R=true, ()=>touchState.R=false);
bindBtn('btnJ', ()=>{ touchState.J = true; jumpBufferT = JUMP_BUFFER; if (state!=='play') handleMenuKey('Enter'); }, ()=>{ touchState.J = false; });
bindBtn('btnF', ()=>{ shootFireball(); }, ()=>{});
const btnFEl = document.getElementById('btnF');

cv.addEventListener('pointerdown', e => {
  audio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  if (state === 'select') {
    selHover = x < W/2 ? 0 : 1;
    chooseChar(selHover);
  } else if (state === 'helper') {
    selHelperHover = x < W/2 ? 0 : 1;
    chooseHelper(selHelperHover);
  } else if (state !== 'play') {
    handleMenuKey('Enter');
  }
});

function handleMenuKey(key) {
  audio();
  const low = typeof key === 'string' ? key.toLowerCase() : key;
  if (state === 'select') {
    if (key === 'ArrowLeft' || low === 'a') selHover = 0;
    if (key === 'ArrowRight' || low === 'd') selHover = 1;
    if (key === 'Enter' || key === ' ') chooseChar(selHover);
    if (key === '1') chooseChar(0);
    if (key === '2') chooseChar(1);
  } else if (state === 'helper') {
    if (key === 'ArrowLeft' || low === 'a') selHelperHover = 0;
    if (key === 'ArrowRight' || low === 'd') selHelperHover = 1;
    if (key === 'Enter' || key === ' ') chooseHelper(selHelperHover);
    if (key === '1') chooseHelper(0);
    if (key === '2') chooseHelper(1);
  } else if (state === 'win' && (key === 'Enter' || key === ' ')) {
    if (stateTimer > 1) { saveRecord(); state = 'select'; stopMusic(); score = 0; lives = LIVES_START; levelIdx = 0; }
  }
}
function chooseChar(i) {
  charIdx = i;
  score = 0; lives = LIVES_START; levelIdx = 0; carryBig = false; carryFire = false;
  loadLevel(0);
  state = 'play';
}
function chooseHelper(i) {
  helperIdx = i;
  const cfg = HELPERS[i];
  helper = { cfg, x: player.x - 80, y: player.y - 40, w: 34, h: Math.round(64 * cfg.scale * 0.8) + 10,
    vx: 0, vy: 0, onGround: false, dir: 1, anim: 0, cool: 1, punchT: 0 };
  state = 'play';
  if (theme !== 'boss') startMusic('boss');   // muzică de suspans cât ține lupta cu mini-boss-ul
  sfx.power();
}

/* ================= NIVEL ================= */
function loadLevel(idx, keepCheckpoint) {
  const rows = LEVELS[idx].map;
  theme = LEVELS[idx].theme;
  levelW = Math.max(...rows.map(r => r.length));
  grid = [];
  enemies = []; coins = []; powerups = []; particles = []; flyCoins = [];
  fireballs = []; glasses = []; rampSteps = []; checkpoints = []; bubbles = [];
  boss = null; helper = null; flagX = 0;
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < levelW; c++) {
      const ch = (rows[r] && rows[r][c]) || '.';
      let t = 0;
      if (ch === '#') t = 1;
      else if (ch === 'B') t = 2;
      else if (ch === 'Q') t = 3;
      else if (ch === '=') t = 4;
      else if (ch === 'W') t = 6;
      else if (ch === 'S') t = 7;
      else if (ch === 'H') t = 8;
      else if (ch === 'I') t = 9;
      else if (ch === 'R') t = 10;    // cărămidă care coboară o rampă la spargere 🪜
      else if (ch === 'Z') t = 11;    // cărămidă easter-egg 🎁
      else if (ch === 'K') { checkpoints.push({ x: c*TILE, y: r*TILE, taken: false }); }
      else if (ch === 'C') { coins.push({ c, r, taken:false, anim: Math.random()*6 }); }
      else if (ch === 'E') { enemies.push(makeEnemy(c*TILE, r*TILE)); }
      else if (ch === 'L') { enemies.push(makeEnemy(c*TILE, r*TILE, 'bird')); }
      else if (ch === 'P') {
        if (!keepCheckpoint) levelSpawn = { x: c*TILE, y: r*TILE };
        spawnPlayer(levelSpawn.x, levelSpawn.y);
      }
      else if (ch === 'F') { flagX = c*TILE + TILE/2; }
      else if (ch === 'X') {
        const mb = LEVELS[idx].miniboss;
        boss = makeBoss(c*TILE, r*TILE, mb ? mb.kind : 'balaur', mb ? mb.hp : BOSS_HP);
      }
      grid[r][c] = t;
    }
  }
  camX = Math.max(0, player.x - W/3);
  startMusic(theme);
}
function makeEnemy(x, y, forceKind) {
  const kind = forceKind || (theme === 'apa' ? 'fish' : theme === 'nori' ? 'bird' : 'walker');
  return { kind, x, y: y + TILE - 40, baseY: y + TILE - 40, w: 40, h: 40, vx: -ENEMY_SPD, vy: 0,
    onGround: false, dead: false, deadT: 0, anim: Math.random()*6 };
}
function makeBoss(x, y, kind, hp) {
  const w = kind === 'boo' ? 90 : kind === 'kong' ? 110 : 120;
  const h = kind === 'boo' ? 90 : 104;
  return { kind: kind || 'balaur', x: x - w/2 + 24, y: y + TILE - h, w, h, homeX: x + 24,
    vx: -70, vy: 0, onGround: false, hp, maxHp: hp, invT: 0, jumpCd: 3.5, dead: false, anim: 0 };
}
function spawnPlayer(x, y) {
  const cfg = CHARACTERS[charIdx];
  const h = Math.round(58 * cfg.scale), w = Math.round(30 * cfg.scale);
  player = { x, y: y + TILE - h, w, h, baseW: w, baseH: h, big: false, fire: false, vx:0, vy:0,
    onGround:false, coyote:0, dir:1, anim:0, invuln:0, wingsT:0, starT:0, flap:0 };
  if (carryBig) growPlayer(true);
  if (carryFire) player.fire = true;
}
function growPlayer(silent) {
  const p = player;
  if (!p.big) {
    p.big = true; carryBig = true;
    const nh = Math.round(p.baseH * 1.3), nw = Math.round(p.baseW * 1.15);
    p.y -= nh - p.h;
    p.h = nh; p.w = nw;
  }
  if (!silent) sfx.power();
}
function shrinkPlayer() {
  const p = player;
  p.big = false; carryBig = false;
  p.y += p.h - p.baseH;
  p.h = p.baseH; p.w = p.baseW;
  p.invuln = 2;
}

function tileAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= levelW) return 1;
  if (r < 0) return 0;
  if (r >= ROWS) return 0;
  return grid[r][c];
}
function solidForBody(t) { return t === 1 || t === 2 || t === 3 || t === 5 || t === 6 || t === 7 || t === 8 || t === 9 || t === 10 || t === 11; }
function solidTop(t)     { return solidForBody(t) || t === 4; }

/* ================= FIZICĂ ================= */
function moveBody(b, dt, isPlayer, grav) {
  b.x += b.vx * dt;
  if (b.vx > 0) {
    const t1 = tileAt(b.x + b.w, b.y + 2), t2 = tileAt(b.x + b.w, b.y + b.h - 2);
    if (solidForBody(t1) || solidForBody(t2)) {
      b.x = Math.floor((b.x + b.w) / TILE) * TILE - b.w - 0.01;
      if (!isPlayer) b.vx = -b.vx; else b.vx = 0;
    }
  } else if (b.vx < 0) {
    const t1 = tileAt(b.x, b.y + 2), t2 = tileAt(b.x, b.y + b.h - 2);
    if (solidForBody(t1) || solidForBody(t2)) {
      b.x = (Math.floor(b.x / TILE) + 1) * TILE + 0.01;
      if (!isPlayer) b.vx = -b.vx; else b.vx = 0;
    }
  }
  b.vy += (grav !== undefined ? grav : GRAV) * dt;
  const maxFall = theme === 'apa' && isPlayer ? 250 : 1200;
  if (b.vy > maxFall) b.vy = maxFall;
  const oldBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.onGround = false;
  if (b.vy > 0) {
    const bottom = b.y + b.h;
    const t1 = tileAt(b.x + 4, bottom), t2 = tileAt(b.x + b.w - 4, bottom);
    const rowTop = Math.floor(bottom / TILE) * TILE;
    if ((solidTop(t1) || solidTop(t2)) &&
        (solidForBody(t1) || solidForBody(t2) || oldBottom <= rowTop + 1)) {
      b.y = rowTop - b.h;
      b.vy = 0;
      b.onGround = true;
    }
  } else if (b.vy < 0) {
    const t1 = tileAt(b.x + 4, b.y), t2 = tileAt(b.x + b.w - 4, b.y);
    if (solidForBody(t1) || solidForBody(t2)) {
      const r = Math.floor(b.y / TILE);
      b.y = (r + 1) * TILE + 0.01;
      b.vy = 0;
      if (isPlayer) hitBlockAbove(r, b);
    }
  }
}

function spawnFlyCoin(x, y) {
  flyCoins.push({ x, y, t: 0, dur: 0.5 + Math.random()*0.15 });
}

function hitBlockAbove(r, b) {
  const cMid = Math.floor((b.x + b.w/2) / TILE);
  for (const c of [cMid, Math.floor((b.x+4)/TILE), Math.floor((b.x+b.w-4)/TILE)]) {
    if (r < 0 || !grid[r]) continue;
    const t = grid[r][c];
    if (t === 3) {            // bloc ? → monedă
      grid[r][c] = 5;
      score += 10;
      spawnFlyCoin(c*TILE+TILE/2, r*TILE);
      sfx.coin();
      return;
    }
    if (t === 2) {            // cărămidă → se sparge!
      grid[r][c] = 0;
      score += 5;
      sfx.brick();
      for (let i = 0; i < 6; i++)
        particles.push({ x:c*TILE+TILE/2, y:r*TILE+TILE/2, vx:(Math.random()-0.5)*350,
          vy:-150-Math.random()*250, t:0.7, col: i%2 ? '#c0562a' : '#7a3418' });
      return;
    }
    if (t === 10) {                        // rampa secretă! 🪜
      grid[r][c] = 0;
      score += 20;
      sfx.brick();
      for (let i = 0; i < 6; i++)
        particles.push({ x:c*TILE+TILE/2, y:r*TILE+TILE/2, vx:(Math.random()-0.5)*350,
          vy:-150-Math.random()*250, t:0.7, col: i%2 ? '#c0562a' : '#7a3418' });
      let k = 0;
      for (let rr = r + 1; rr <= 10; rr++, k++) {    // trepte care coboară spre stânga, pe rând
        rampSteps.push({ r: rr, c1: c - 1 - 2*k, c2: c - 2*k, at: time + 0.3 + k * 0.3 });
      }
      return;
    }
    if (t === 6 || t === 7 || t === 8 || t === 9) {   // power-up ascuns!
      grid[r][c] = 5;
      const type = t === 6 ? 'wings' : t === 7 ? 'star' : t === 8 ? 'heart' : 'ice';
      powerups.push({ type, x:c*TILE+TILE/2, y:r*TILE, targetY:(r-1)*TILE + TILE/2, phase:'rising' });
      sfx.power();
      return;
    }
    if (t === 11) {                        // easter egg ascuns! 🎁
      grid[r][c] = 5;
      score += 50;
      sfx.power(); sfx.heart();
      for (let i=0;i<10;i++) particles.push({ x:c*TILE+TILE/2, y:r*TILE+TILE/2, vx:(Math.random()-0.5)*350,
        vy:-150-Math.random()*250, t:0.7, col: ['#ffd700','#ff8fb5','#7fd4ff'][i%3] });
      state = 'easteregg'; stateTimer = 0;
      return;
    }
  }
}

/* ================= UPDATE ================= */
function update(dt) {
  time += dt;
  stateTimer += dt;
  if (state !== 'play') { updateFX(dt); return; }

  const p = player;
  const flying = p.wingsT > 0 || theme === 'nori';
  const swimming = theme === 'apa';

  // mișcare orizontală
  if (inputLeft() && !inputRight())  { p.vx -= MOVE_ACC*dt; p.dir = -1; }
  else if (inputRight() && !inputLeft()) { p.vx += MOVE_ACC*dt; p.dir = 1; }
  else {
    if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION*dt);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION*dt);
  }
  p.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, p.vx));

  // săritură / înot / zbor
  if (p.onGround) p.coyote = COYOTE; else p.coyote -= dt;
  if (jumpBufferT > 0) jumpBufferT -= dt;
  let grav = GRAV;
  if (swimming) {
    grav = 520;
    if (jumpBufferT > 0) {          // fluturare de înot — merge oricând
      p.vy = -330;
      jumpBufferT = 0;
      p.flap = 0.25;
      sfx.swim();
    }
  } else if (flying) {
    grav = 1500;
    if (jumpBufferT > 0 && p.coyote > 0) {   // săritură normală de pe sol
      p.vy = -JUMP_V * 0.8;
      p.coyote = 0; jumpBufferT = 0;
      sfx.jump();
    }
    if (inputJumpHeld() && !p.onGround) {    // ține apăsat = zbori în sus
      p.vy -= 3400 * dt;
      if (p.vy < -360) p.vy = -360;
      p.flap = 0.15;
      if (Math.floor(time*6) % 3 === 0 && Math.random() < 0.1) sfx.fly();
    }
    if (p.vy > 420) p.vy = 420;
  } else {
    if (jumpBufferT > 0 && p.coyote > 0) {
      p.vy = -JUMP_V;
      p.coyote = 0; jumpBufferT = 0;
      sfx.jump();
    }
    if (p.vy < -300 && !inputJumpHeld()) p.vy = -300;
  }

  moveBody(p, dt, true, grav);
  if (Math.abs(p.vx) > 20 && p.onGround) p.anim += dt * 12; else if (p.onGround) p.anim = 0;
  if (!p.onGround && (flying || swimming)) p.anim += dt * 10;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.wingsT > 0) p.wingsT -= dt;
  if (p.starT > 0) p.starT -= dt;
  if (p.flap > 0) p.flap -= dt;

  if (swimming) {                        // bulițe din mască cât înoată 🫧
    bubbleCd -= dt;
    if (bubbleCd <= 0) {
      bubbleCd = 0.3 + Math.random()*0.25;
      bubbles.push({ x: p.x + p.w/2 - p.dir*8, y: p.y + p.h*0.3, vx:(Math.random()-0.5)*20, vy:-40-Math.random()*30, t: 1.4, r: 2.5+Math.random()*2.5 });
    }
  }

  if (p.y > H + 100) hurtPlayer(true);   // căderea în gol e mereu fatală

  // monede
  for (const cn of coins) {
    if (cn.taken) continue;
    cn.anim += dt * 6;
    const cx = cn.c*TILE + TILE/2, cy = cn.r*TILE + TILE/2;
    if (Math.abs(p.x + p.w/2 - cx) < TILE*0.55 && Math.abs(p.y + p.h/2 - cy) < TILE*0.6) {
      cn.taken = true; score += 10; sfx.coin();
      spawnFlyCoin(cx, cy);
      for (let i=0;i<6;i++) particles.push({ x:cx, y:cy, vx:(Math.random()-0.5)*200, vy:-Math.random()*250, t:0.5, col:'#ffd700' });
    }
  }

  // power-up-uri (ies din cărămidă, apoi merg ca ciupercile din Mario)
  for (const pu of powerups) {
    if (pu.phase === 'rising') {
      pu.y -= 90 * dt;
      if (pu.y <= pu.targetY) { pu.y = pu.targetY; pu.phase = 'walk'; pu.vx = 70; pu.vy = 0; }
    } else {
      const body = { x: pu.x - 16, y: pu.y - 16, w: 32, h: 32, vx: pu.vx, vy: pu.vy };
      moveBody(body, dt, false);
      pu.x = body.x + 16; pu.y = body.y + 16; pu.vx = body.vx; pu.vy = body.vy;
      if (pu.y > H + 200) pu.taken = true;
    }
    if (Math.abs(p.x + p.w/2 - pu.x) < 40 && Math.abs(p.y + p.h/2 - pu.y) < 46) {
      pu.taken = true;
      if (pu.type === 'wings') { p.wingsT = WINGS_TIME; sfx.power(); }
      else if (pu.type === 'star') { p.starT = STAR_TIME; sfx.star(); }
      else if (pu.type === 'heart') { lives = Math.min(lives + 1, LIVES_START); sfx.heart(); }
      else if (pu.type === 'ice') {
        if (!p.big) growPlayer();                              // prima înghețată: MARE 🍦
        else if (!p.fire) { p.fire = true; carryFire = true; sfx.star(); }   // a doua: bile de foc 🔥
        else score += 50;
      }
      score += 25;
      for (let i=0;i<10;i++) particles.push({ x:pu.x, y:pu.y, vx:(Math.random()-0.5)*300, vy:-Math.random()*300, t:0.6,
        col: pu.type==='star' ? '#ffd700' : pu.type==='heart' ? '#ff6090' : '#fff' });
    }
  }
  powerups = powerups.filter(pu => !pu.taken);

  // inamici
  for (const en of enemies) {
    if (en.dead) { en.deadT -= dt; continue; }
    en.anim += dt * 8;
    if (en.kind === 'walker') {
      // întoarce-te cu o dală înainte de marginea gropii (să nu pândească pe buza ei)
      const aheadX = en.vx < 0 ? en.x - 36 : en.x + en.w + 36;
      if (en.onGround && !solidTop(tileAt(aheadX, en.y + en.h + 4))) en.vx = -en.vx;
      moveBody(en, dt, false);
      if (en.y > H + 200) { en.dead = true; en.deadT = 0; continue; }
    } else {                       // pește / pasăre — plutesc
      en.x += en.vx * dt;
      const aheadX = en.vx < 0 ? en.x - 2 : en.x + en.w + 2;
      if (solidForBody(tileAt(aheadX, en.y + en.h/2)) || en.x < 0 || en.x > levelW*TILE - en.w) en.vx = -en.vx;
      en.y = en.baseY + Math.sin(en.anim * 0.6) * (en.kind === 'bird' ? 42 : 26);
    }
    if (rectHit(p, en)) {
      if (p.starT > 0) {           // steaua distruge tot!
        en.dead = true; en.deadT = 0.4;
        score += 25; sfx.stomp();
        for (let i=0;i<8;i++) particles.push({ x:en.x+en.w/2, y:en.y+en.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*250, t:0.4, col:'#ffd700' });
      } else if ((p.vy > 100 && p.y + p.h - en.y < 28) ||
                 (p.vy > 400 && p.y + p.h - en.y < en.h * 0.9)) {   // cădere rapidă = turtit oriunde l-ai atins
        en.dead = true; en.deadT = 0.5;
        p.vy = -JUMP_V * 0.55;
        score += 25; sfx.stomp();
        for (let i=0;i<8;i++) particles.push({ x:en.x+en.w/2, y:en.y+en.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*200, t:0.4, col:'#a05a2c' });
      } else if (p.invuln <= 0) {
        hurtPlayer();
      }
    }
  }
  // bile de foc 🔥
  if (fireCd > 0) fireCd -= dt;
  for (const fb of fireballs) {
    fb.t -= dt;
    fb.vy += 1300 * dt;
    fb.x += fb.vx * dt; fb.y += fb.vy * dt;
    if (fb.vy > 0 && solidTop(tileAt(fb.x, fb.y + 9))) fb.vy = -380;       // ricoșează pe sol
    if (solidForBody(tileAt(fb.x + Math.sign(fb.vx) * 10, fb.y))) fb.t = 0;
    for (const en of enemies) {
      if (!en.dead && fb.t > 0 && fb.x > en.x - 8 && fb.x < en.x + en.w + 8 && fb.y > en.y - 8 && fb.y < en.y + en.h + 8) {
        en.dead = true; en.deadT = 0.4; fb.t = 0; score += 25; sfx.stomp();
        for (let i=0;i<8;i++) particles.push({ x:en.x+en.w/2, y:en.y+en.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*250, t:0.4, col:'#ff9f1c' });
      }
    }
    if (boss && !boss.dead && fb.t > 0 && boss.invT <= 0 &&
        fb.x > boss.x && fb.x < boss.x + boss.w && fb.y > boss.y && fb.y < boss.y + boss.h) {
      fb.t = 0; bossDamage(1);
    }
  }
  fireballs = fireballs.filter(fb => fb.t > 0);
  // ochelarii aruncați de Deni 👓
  for (const gl of glasses) {
    gl.t -= dt;
    gl.vy += 900 * dt;
    gl.x += gl.vx * dt; gl.y += gl.vy * dt;
    gl.spin += dt * 22;
    if (solidForBody(tileAt(gl.x, gl.y))) gl.t = 0;
    if (boss && !boss.dead && gl.t > 0 && boss.invT <= 0 &&
        gl.x > boss.x && gl.x < boss.x + boss.w && gl.y > boss.y && gl.y < boss.y + boss.h) {
      gl.t = 0;
      bossDamage(boss.kind === 'balaur' ? 1 : 0.5);
      for (let i=0;i<6;i++) particles.push({ x:gl.x, y:gl.y, vx:(Math.random()-0.5)*300, vy:-Math.random()*250, t:0.4, col:'#3a3f44' });
    }
    for (const en of enemies) {
      if (!en.dead && gl.t > 0 && gl.x > en.x-8 && gl.x < en.x+en.w+8 && gl.y > en.y-8 && gl.y < en.y+en.h+8) {
        en.dead = true; en.deadT = 0.4; gl.t = 0; score += 25; sfx.stomp();
        for (let i=0;i<6;i++) particles.push({ x:en.x+en.w/2, y:en.y+en.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*250, t:0.4, col:'#3a3f44' });
      }
    }
  }
  glasses = glasses.filter(gl => gl.t > 0);
  enemies = enemies.filter(e => !e.dead || e.deadT > 0);

  // boss + ajutor
  if (boss && !boss.dead) updateBoss(dt);
  if (helper) updateHelper(dt);

  // checkpoint — de aici reiei dacă mori, nu de la începutul nivelului 🚩
  for (const cp of checkpoints) {
    if (!cp.taken && p.x + p.w/2 > cp.x) {
      cp.taken = true;
      levelSpawn = { x: cp.x, y: cp.y };
      sfx.power();
      for (let i=0;i<8;i++) particles.push({ x:cp.x, y:cp.y+TILE/2, vx:(Math.random()-0.5)*200, vy:-100-Math.random()*200, t:0.5, col:'#7fd4ff' });
    }
  }

  // steag (blocat cât timp trăiește minibossul!)
  if (flagX > 0 && (!boss || boss.dead) && p.x + p.w/2 > flagX) {
    state = 'levelend'; stateTimer = 0;
    score += 100;
    saveRecord();
    sfx.flag();
  }

  // cameră
  const target = p.x - W*0.38;
  camX += (target - camX) * Math.min(1, dt*6);
  camX = Math.max(0, Math.min(camX, levelW*TILE - W));

  updateFX(dt);
}

function updateBoss(dt) {
  const b = boss, p = player;
  b.anim += dt * 6;
  if (b.invT > 0) b.invT -= dt;
  // viteza crește când e rănit
  const base = b.kind === 'kong' ? 60 : b.kind === 'bowzer' ? 55 : 70;
  const spd = base + (1 - b.hp / b.maxHp) * (b.kind === 'balaur' ? 55 : 35);
  b.vx = b.vx < 0 ? -spd : spd;
  if (b.kind === 'boo') {
    // Regele Bu plutește 👻
    b.x += b.vx * dt;
    if (Math.abs(b.x + b.w/2 - b.homeX) > 380 ||
        solidForBody(tileAt(b.vx < 0 ? b.x - 4 : b.x + b.w + 4, b.y + b.h/2))) b.vx = -b.vx;
    b.y = 11*TILE - b.h - 26 + Math.sin(b.anim * 0.8) * 24;
  } else {
    b.jumpCd -= dt;
    if (b.jumpCd <= 0 && b.onGround) { b.vy = -620; b.jumpCd = (b.kind === 'kong' ? 1.8 : 2.5) + Math.random() * 2; }
    const aheadX = b.vx < 0 ? b.x - 36 : b.x + b.w + 36;   // nu cade în gropi
    if (b.onGround && !solidTop(tileAt(aheadX, b.y + b.h + 4))) b.vx = -b.vx;
    moveBody(b, dt, false);
  }

  // lovit de jucător
  if (rectHit(p, b)) {
    if (p.vy > 100 && p.y + p.h - b.y < 58 && b.invT <= 0) {
      bossDamage(2);
      p.vy = -JUMP_V * 0.6;
    } else if (p.invuln <= 0 && b.invT <= 0) {
      hurtPlayer();
    }
  }
}
function bossDamage(dmg) {
  boss.hp -= dmg;
  boss.invT = 0.9;
  score += 50;
  sfx.bossHit();
  for (let i=0;i<10;i++) particles.push({ x:boss.x+boss.w/2, y:boss.y+30, vx:(Math.random()-0.5)*400, vy:-Math.random()*300, t:0.5, col:'#8a4aa0' });
  if (boss.hp <= 0) {
    boss.dead = true;
    saveRecord();
    for (let i=0;i<40;i++) particles.push({ x:boss.x+boss.w/2, y:boss.y+boss.h/2, vx:(Math.random()-0.5)*600, vy:-Math.random()*500, t:1.2,
      col:['#8a4aa0','#ffd700','#e63946','#2a9d8f'][i%4] });
    if (levelIdx === LEVELS.length - 1) {
      // bossul final → victorie mare, finish-move mare
      state = 'bossdead'; stateTimer = 0;
      score += 500;
      stopMusic();
      sfx.win();
    } else {
      // miniboss învins → finish-move + sărbătorim
      state = 'minibossdead'; stateTimer = 0;
      score += 300;
      sfx.win();
    }
  }
}
function nearestLiveEnemy(h) {
  let best = null, bestD = 999999;
  for (const en of enemies) {
    if (en.dead) continue;
    const d = Math.abs((en.x + en.w/2) - (h.x + h.w/2));
    if (d < bestD) { bestD = d; best = en; }
  }
  return (best && bestD < 260) ? best : null;
}
function updateHelper(dt) {
  const h = helper, b = boss;
  h.cool -= dt;
  if (h.punchT > 0) h.punchT -= dt;
  const fightMode = b && !b.dead && Math.abs((b.x + b.w/2) - (player.x + player.w/2)) < 750;
  const meleeRange = h.cfg.attack === 'punch';
  const nearEnemy = nearestLiveEnemy(h);
  // în luptă cu boss-ul rămâne concentrat pe el, dar dacă un inamic (ex: liliac) trece chiar pe lângă el, îl curăță
  const engageRange = meleeRange ? 90 : 180;
  const engageEnemy = !fightMode ? nearEnemy
    : (nearEnemy && Math.abs((nearEnemy.x+nearEnemy.w/2)-(h.x+h.w/2)) < engageRange ? nearEnemy : null);

  let tx;
  if (engageEnemy) {
    const ex = engageEnemy.x + engageEnemy.w/2;
    tx = ex - h.w/2 - (meleeRange ? 0 : Math.sign(ex-(h.x+h.w/2) || 1) * 90);
  } else if (fightMode) {
    tx = b.x + b.w/2 - h.w/2 - (meleeRange ? 0 : Math.sign((b.x+b.w/2)-(h.x+h.w/2) || 1) * 90);
  } else {
    tx = player.x - 45;   // rămâne aproape de jucător, îl urmărește îndeaproape
  }
  const dx = tx - h.x;
  if (Math.abs(dx) > 20) { h.vx += Math.sign(dx) * 2000 * dt; h.dir = Math.sign(dx) || 1; }
  else { h.vx *= 0.85; }
  h.vx = Math.max(-300, Math.min(300, h.vx));
  if (engageEnemy) {                                    // ajutorul curăță inamicii din cale (inclusiv lângă boss) 💪
    const edx = (engageEnemy.x + engageEnemy.w/2) - (h.x + h.w/2);
    const edist = Math.abs(edx);
    h.dir = Math.sign(edx) || h.dir;
    if (meleeRange) {
      if (edist < 70 && h.cool <= 0) {
        h.punchT = 0.5; h.cool = 1.3;
        engageEnemy.dead = true; engageEnemy.deadT = 0.4;
        score += 25; sfx.stomp();
        for (let i=0;i<5;i++) particles.push({ x:engageEnemy.x+engageEnemy.w/2, y:engageEnemy.y+engageEnemy.h/2, vx:(Math.random()-0.5)*250, vy:-Math.random()*200, t:0.4, col:'#a05a2c' });
      }
    } else if (edist < 280 && edist > 30 && h.cool <= 0) {
      h.punchT = 0.4; h.cool = 1.6;
      glasses.push({ x: h.x + h.w/2 + h.dir*10, y: h.y + h.h*0.32, vx: h.dir*520, vy: -80, t: 1.4, spin: 0 });
      beep(700, 0.09, 'square', 0.1, -200);
    }
  } else if (fightMode) {
    const bdx = b.x + b.w/2 - (h.x + h.w/2);
    const dist = Math.abs(bdx);
    if (!h.onGround) h.vx += Math.sign(bdx) * 1100 * dt;
    h.dir = Math.sign(bdx) || h.dir;
    let attacked = false;
    if (meleeRange) {                                  // Alin: pumn corp la corp 👊
      if (dist < 74 && h.cool <= 0 && b.invT <= 0) {
        h.punchT = 0.5; h.cool = 1.1; attacked = true;
        bossDamage(b.kind === 'balaur' ? 1 : 0.5);      // Balaurul: 50% din damage-ul jucătorului; mini-boși: 25%
        sfx.stomp();
        for (let i=0;i<5;i++) particles.push({ x:b.x+b.w/2-bdx*0.3, y:b.y+b.h*0.4, vx:h.dir*250+(Math.random()-0.5)*120, vy:-Math.random()*180, t:0.3, col:'#eec096' });
      }
    } else if (dist < 340 && h.cool <= 0 && b.invT <= 0) {   // Deni: aruncă ochelarii de la distanță 👓
      h.punchT = 0.4; h.cool = 1.7; attacked = true;
      glasses.push({ x: h.x + h.w/2 + h.dir*10, y: h.y + h.h*0.32, vx: h.dir*520, vy: -80, t: 1.4, spin: 0 });
      beep(700, 0.09, 'square', 0.1, -200);
    }
    if (!attacked && dist < 260 && h.onGround && h.cool <= 0 &&
        Math.sign(b.vx) !== Math.sign(bdx)) {   // sare când bossul vine spre el, ca să evite lovitura
      h.vy = -JUMP_V * 0.95;
      h.cool = 1.4;
    }
  }
  if (!fightMode) {
    // sare peste obstacole și gropi când te urmărește sau când vânează un inamic
    const lookAhead = 18;
    const wa = solidForBody(tileAt(h.x + (h.dir > 0 ? h.w + lookAhead : -lookAhead), h.y + h.h - 10));
    const pa = !solidTop(tileAt(h.x + (h.dir > 0 ? h.w + lookAhead : -lookAhead), h.y + h.h + 30));
    if (h.onGround && (wa || pa)) { h.vy = -JUMP_V; h.vx = h.dir * 300; }   // salt complet, la fel de puternic ca al jucătorului
  }
  moveBody(h, dt, false);
  h.vx = Math.max(-300, Math.min(300, h.vx));
  if (h.y > H + 150) { h.x = player.x - 45; h.y = player.y - 60; h.vy = 0; }   // plasă de siguranță
  if (Math.abs(h.vx) > 20 && h.onGround) h.anim += dt * 11; else if (h.onGround) h.anim = 0;
}

function updateFX(dt) {
  // treptele rampei apar pe rând ✨
  for (const st of rampSteps) {
    if (time >= st.at && !st.done) {
      st.done = true;
      for (const cc of [st.c1, st.c2]) {
        if (cc >= 0 && cc < levelW && grid[st.r][cc] === 0) {
          grid[st.r][cc] = 4;
          for (let i=0;i<5;i++) particles.push({ x:cc*TILE+TILE/2, y:st.r*TILE+8, vx:(Math.random()-0.5)*160, vy:-Math.random()*140, t:0.5, col:'#b28dff' });
        }
      }
      beep(400 + st.r * 30, 0.1, 'triangle', 0.1);
    }
  }
  rampSteps = rampSteps.filter(st => !st.done);

  // artificii la final de nivel 🎆
  if (state === 'levelend' || state === 'bossdead' || state === 'minibossdead') {
    fwT -= dt;
    if (fwT <= 0) { fwT = 0.38; spawnFirework(); }
  }

  for (const pt of particles) { pt.t -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += 800*dt; }
  particles = particles.filter(pt => pt.t > 0);
  for (const bu of bubbles) { bu.t -= dt; bu.x += bu.vx*dt; bu.y += bu.vy*dt; bu.vy *= 0.985; }
  bubbles = bubbles.filter(bu => bu.t > 0);
  for (const fc of flyCoins) {
    fc.t += dt;
    if (fc.t >= fc.dur && !fc.popped) {
      fc.popped = true;
      sfx.poc();
      for (let i=0;i<6;i++) particles.push({ x: camX+48, y: 39, vx:(Math.random()-0.5)*160, vy:(Math.random()-0.5)*160, t:0.3, col:'#ffd700' });
    }
  }
  flyCoins = flyCoins.filter(fc => fc.t < fc.dur);

  if (state === 'levelend' && stateTimer > 7) {
    levelIdx++;
    if (levelIdx >= LEVELS.length) { state = 'win'; stateTimer = 0; stopMusic(); sfx.win(); }
    else {
      loadLevel(levelIdx);
      state = (LEVELS[levelIdx].theme === 'boss' || LEVELS[levelIdx].miniboss) ? 'helper' : 'play';
      if (LEVELS[levelIdx].theme === 'boss') stopMusic();
      else if (LEVELS[levelIdx].miniboss) startMusic('boss');   // muzică de suspans la mini-boși
    }
  }
  if (state === 'bossdead' && stateTimer > 20) { state = 'win'; stateTimer = 0; }
  if (state === 'minibossdead' && stateTimer > 10) { state = 'play'; startMusic(theme); }
  if (state === 'easteregg' && stateTimer > 3.5) { state = 'play'; }
  if (state === 'dead' && stateTimer > 1.5) {
    if (lives <= 0) { lives = LIVES_START; }
    if (boss && !boss.dead) {
      // orice boss rămâne rănit — doar jucătorul reapare la start, ajutorul e transferat lângă el
      spawnPlayer(levelSpawn.x, levelSpawn.y);
      if (helper) { helper.x = player.x - 80; helper.y = player.y - 40; helper.vx = 0; helper.vy = 0; }
      state = 'play';
    } else {
      loadLevel(levelIdx, true);   // reia de la ultimul checkpoint, nu de la începutul nivelului
      if (LEVELS[levelIdx].theme === 'boss' || LEVELS[levelIdx].miniboss) {
        chooseHelper(helperIdx);    // ajutorul revine automat
      } else {
        state = 'play';
      }
    }
    player.invuln = 2;
  }
}

function spawnFirework() {
  const fx = camX + 120 + Math.random() * (W - 240);
  const fy = 80 + Math.random() * 190;
  const cols = ['#ff5252','#ffd700','#4dd0e1','#b388ff','#69f0ae','#ff9f1c'];
  const col = cols[Math.floor(Math.random()*cols.length)];
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * Math.PI * 2 + Math.random()*0.2;
    const sp = 150 + Math.random() * 170;
    particles.push({ x: fx, y: fy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60, t: 0.9 + Math.random()*0.4, col });
  }
  beep(500 + Math.random()*400, 0.22, 'triangle', 0.08, -250);
}

function shootFireball() {
  const p = player;
  if (!p || !p.fire || state !== 'play' || fireCd > 0) return;
  fireCd = 0.35;
  fireballs.push({ x: p.x + p.w/2 + p.dir*18, y: p.y + p.h*0.45, vx: p.dir*430, vy: 60, t: 2.2 });
  beep(600, 0.1, 'square', 0.1, -300);
}

function hurtPlayer(fatal) {
  if (godMode) return;
  const p = player;
  if (!fatal && p.fire) {
    // pierzi întâi puterea de foc, rămâi mare
    p.fire = false; carryFire = false;
    p.invuln = 2;
    sfx.hurt();
    for (let i=0;i<8;i++) particles.push({ x:p.x+p.w/2, y:p.y+p.h/2, vx:(Math.random()-0.5)*250, vy:-Math.random()*250, t:0.5, col:'#ff9f1c' });
    return;
  }
  if (!fatal && p.big) {
    // ești mare: prima lovitură doar te micșorează, nu pierzi viața
    shrinkPlayer();
    sfx.hurt();
    for (let i=0;i<8;i++) particles.push({ x:p.x+p.w/2, y:p.y+p.h/2, vx:(Math.random()-0.5)*250, vy:-Math.random()*250, t:0.5, col:'#ffd9ec' });
    return;
  }
  carryBig = false; carryFire = false;
  lives--;
  saveRecord();
  sfx.hurt();
  state = 'dead'; stateTimer = 0;
  for (let i=0;i<10;i++) particles.push({ x:p.x+p.w/2, y:p.y+p.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*300, t:0.6, col:CHARACTERS[charIdx].shirt });
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ================= DESEN ================= */
function draw() {
  drawBackground();

  if (state === 'select') { drawSelect(); return; }

  ctx.save();
  ctx.translate(-Math.floor(camX), 0);

  const c0 = Math.floor(camX/TILE), c1 = Math.min(levelW-1, c0 + Math.ceil(W/TILE) + 1);
  for (let r = 0; r < ROWS; r++)
    for (let c = c0; c <= c1; c++)
      drawTile(grid[r][c], c*TILE, r*TILE);

  if (flagX > 0) drawFlag();
  for (const cp of checkpoints) drawCheckpoint(cp);

  for (const cn of coins) {
    if (cn.taken) continue;
    drawCoin(cn.c*TILE + TILE/2, cn.r*TILE + TILE/2, cn.anim);
  }
  for (const fc of flyCoins) {
    const frac = Math.min(1, fc.t / fc.dur);
    const e = 1 - Math.pow(1 - frac, 3);
    const tx = camX + 48, ty = 39;
    const x = fc.x + (tx - fc.x) * e;
    const y = fc.y + (ty - fc.y) * e - Math.sin(frac * Math.PI) * 40;   // arc ușor spre scor ⭐
    drawCoin(x, y, time*10, 1 - frac*0.6);
  }
  for (const bu of bubbles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, bu.t*1.5));
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const pu of powerups) drawPowerup(pu);
  for (const fb of fireballs) {
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.arc(fb.x, fb.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.arc(fb.x - Math.sign(fb.vx)*2, fb.y - 2, 4.5, 0, Math.PI*2); ctx.fill();
  }
  for (const gl of glasses) drawThrownGlasses(gl);
  for (const en of enemies) drawEnemy(en);
  if (state === 'minibossdead') drawFinishMove(10);
  else if (state === 'bossdead') drawFinishMove(20);
  else if (boss) drawBoss();
  if (helper) drawKidOnFoot(helper.x + helper.w/2, helper.y + helper.h, helper.cfg, helper.h, helper.dir, helper.anim, !helper.onGround, helper.punchT > 0);

  if (state !== 'dead') {
    const p = player;
    if (!(p.invuln > 0 && Math.floor(time*12)%2===0)) {
      const wings = p.wingsT > 0 || theme === 'nori';
      if (p.starT > 0) {   // invincibil: tot personajul în culorile curcubeului 🌈
        ctx.filter = 'hue-rotate(' + (Math.floor(time * 600) % 360) + 'deg) saturate(1.9) brightness(1.15)';
      }
      drawKid(p.x + p.w/2, p.y + p.h, CHARACTERS[charIdx], p.h, p.dir, p.anim, !p.onGround, wings);
      ctx.filter = 'none';
      if (theme === 'apa') drawDiveMask(p.x + p.w/2, p.y + p.h*0.16, p.dir, p.h/58);
      if (p.starT > 0) drawStarAura(p);
      if (p.fire) {        // flacăra puterii de foc
        const fl = 5 + Math.sin(time*18) * 2.5;
        const fx = p.x + p.w/2 + p.dir * (p.w/2 + 9);
        ctx.fillStyle = '#ff9f1c';
        ctx.beginPath(); ctx.arc(fx, p.y + p.h*0.42, fl, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffe27a';
        ctx.beginPath(); ctx.arc(fx, p.y + p.h*0.42 - 2, fl*0.5, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.t*2));
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x-4, pt.y-4, 8, 8);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  drawHUD();
  if ((boss && state !== 'minibossdead' && state !== 'bossdead') || state === 'helper') drawBossBar();

  if (state === 'helper') drawHelperSelect();
  if (state === 'dead') drawOverlay(lives > 0 ? 'Ups! 😅 Mai încearcă!' : 'Nu-i nimic! 💪 O luăm de la capăt!', '');
  if (state === 'levelend') drawOverlay('Bravo, ' + CHARACTERS[charIdx].name + '! 🎉', levelIdx+1 < LEVELS.length ? 'Urmează: ' + LEVELS[levelIdx+1].name : 'Ai terminat totul!');
  if (state === 'minibossdead') drawOverlay('Ai învins pe ' + bossTitle() + '! 🎉', 'Echipă grozavă! ⭐');
  if (state === 'bossdead') drawBossVictory();
  if (state === 'easteregg') drawEasterEgg();
  if (state === 'win') drawWin();
}

function drawBackground() {
  let top = '#5c94fc', bot = '#9cc6ff';
  if (theme === 'subteran' && state !== 'select') { top = '#191927'; bot = '#2c2c44'; }
  if (theme === 'apa' && state !== 'select')      { top = '#1a6ac0'; bot = '#0a3a80'; }
  if (theme === 'nori' && state !== 'select')     { top = '#7ec0ff'; bot = '#d8ecff'; }
  if (theme === 'boss' && state !== 'select')     { top = '#2a1425'; bot = '#4a2438'; }
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, top); sky.addColorStop(1, bot);
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  if (state === 'select') { drawClouds(); drawHills(); return; }

  if (theme === 'campie') { drawClouds(); drawHills(); }
  else if (theme === 'subteran') {
    ctx.fillStyle = 'rgba(120,120,180,.12)';
    for (let i = 0; i < 12; i++) {
      const x = ((i * 233 + 60 - camX*0.4) % (W + 300)) - 150;
      ctx.fillRect(x, 60 + (i%4)*110, 14, 34);
    }
  } else if (theme === 'apa') {
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = 0; i < 5; i++) {
      const x = ((i * 300 + 80 - camX*0.2) % (W + 400)) - 200;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + 130, 0); ctx.lineTo(x + 320, H); ctx.lineTo(x + 190, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    for (let i = 0; i < 14; i++) {
      const bx = ((i * 173 + 40 - camX*0.3) % (W + 100)) - 50;
      const by = H - ((time * (30 + i*7) + i * 210) % (H + 60));
      ctx.beginPath(); ctx.arc(bx, by, 3 + (i%3)*2, 0, Math.PI*2); ctx.fill();
    }
  } else if (theme === 'nori') {
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(W - 130, 90, 46, 0, Math.PI*2); ctx.fill();
    drawClouds();
  } else if (theme === 'boss') {
    ctx.fillStyle = 'rgba(255,90,40,.14)';
    for (let i = 0; i < 8; i++) {
      const x = ((i * 320 + 100 - camX*0.5) % (W + 400)) - 200;
      ctx.beginPath();
      ctx.moveTo(x, H); ctx.lineTo(x + 40, H - 130 - (i%3)*50); ctx.lineTo(x + 80, H);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawTile(t, x, y) {
  if (t === 0) return;
  if (t === 1) {
    if (theme === 'subteran') {
      ctx.fillStyle = '#3c3c5e'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#50507a'; ctx.fillRect(x, y, TILE, 8);
      ctx.fillStyle = '#2c2c48'; ctx.fillRect(x+8, y+20, 10, 10); ctx.fillRect(x+28, y+32, 8, 8);
    } else if (theme === 'apa') {
      ctx.fillStyle = '#d8c27a'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#eeda94'; ctx.fillRect(x, y, TILE, 8);
      ctx.fillStyle = '#b8a25c'; ctx.fillRect(x+10, y+22, 8, 6); ctx.fillRect(x+30, y+34, 8, 6);
    } else if (theme === 'nori') {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y+8, TILE, TILE-8);
      ctx.beginPath();
      ctx.arc(x+10, y+12, 12, 0, Math.PI*2);
      ctx.arc(x+26, y+8, 14, 0, Math.PI*2);
      ctx.arc(x+40, y+12, 11, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#dfe9f5'; ctx.fillRect(x+8, y+34, 12, 6);
    } else if (theme === 'boss') {
      ctx.fillStyle = '#4a3a50'; ctx.fillRect(x, y, TILE, TILE);
      ctx.strokeStyle = '#32242e'; ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, TILE-2, TILE-2);
      ctx.strokeRect(x+1, y+1, TILE/2, TILE/2);
    } else {
      ctx.fillStyle = '#c8824a'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#5cb85c'; ctx.fillRect(x, y, TILE, 10);
      ctx.fillStyle = '#8a5a30';
      ctx.fillRect(x+6, y+20, 8, 8); ctx.fillRect(x+28, y+32, 8, 8); ctx.fillRect(x+18, y+14, 6, 6);
    }
  } else if (t === 2 || t === 6 || t === 7 || t === 8 || t === 9 || t === 10 || t === 11) {   // cărămizile cu secrete arată identic 😉
    ctx.fillStyle = '#c0562a'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#7a3418'; ctx.lineWidth = 3;
    ctx.strokeRect(x+1.5, y+1.5, TILE-3, TILE-3);
    ctx.beginPath();
    ctx.moveTo(x, y+TILE/2); ctx.lineTo(x+TILE, y+TILE/2);
    ctx.moveTo(x+TILE/2, y); ctx.lineTo(x+TILE/2, y+TILE/2);
    ctx.moveTo(x+TILE/4, y+TILE/2); ctx.lineTo(x+TILE/4, y+TILE);
    ctx.moveTo(x+3*TILE/4, y+TILE/2); ctx.lineTo(x+3*TILE/4, y+TILE);
    ctx.stroke();
  } else if (t === 3) {
    const bounce = Math.sin(time*4) * 2;
    ctx.fillStyle = '#f8b800'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#9a6a00'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, TILE-4, TILE-4);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x + TILE/2, y + TILE/2 + bounce);
  } else if (t === 4) {
    ctx.fillStyle = theme === 'nori' ? '#fff' : theme === 'subteran' ? '#6a5a9a' : '#2a9d3a';
    ctx.fillRect(x, y, TILE, 14);
    ctx.fillStyle = theme === 'nori' ? '#d8e4f0' : theme === 'subteran' ? '#4a3a72' : '#1a7a28';
    ctx.fillRect(x, y+10, TILE, 4);
  } else if (t === 5) {
    ctx.fillStyle = '#9a7a4a'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#6a5230'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, TILE-4, TILE-4);
  }
}

function drawCoin(x, y, anim, scale) {
  scale = scale || 1;
  const sq = Math.abs(Math.sin(anim));
  const w = (12 * sq + 3) * scale;
  ctx.fillStyle = '#f8b800';
  ctx.beginPath(); ctx.ellipse(x, y, w, 15*scale, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.ellipse(x, y, w*0.55, 9*scale, 0, 0, Math.PI*2); ctx.fill();
}

function drawPowerup(pu) {
  const bob = pu.phase === 'walk' ? Math.sin(time*8) * 2 : 0;
  const x = pu.x, y = pu.y + bob;
  if (pu.type === 'wings') {
    const fl = Math.sin(time*14) * 6;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x-18, y-4+fl*0.3, 10, 5, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+18, y-4+fl*0.3, 10, 5, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.beginPath(); ctx.arc(x, y-4, 14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x-6, y-9, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+5, y-7, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.fillRect(x-7, y-4, 14, 10);
  } else if (pu.type === 'star') {
    ctx.save();
    ctx.translate(x, y-2);
    ctx.rotate(time*3);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? 16 : 7;
      const a = i * Math.PI / 5 - Math.PI/2;
      ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (pu.type === 'ice') {
    // înghețată: cornet + două cupe 🍦
    ctx.fillStyle = '#d9a066';
    ctx.beginPath(); ctx.moveTo(x-9, y-4); ctx.lineTo(x+9, y-4); ctx.lineTo(x, y+16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b8814a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-5, y+1); ctx.lineTo(x+7, y-2); ctx.moveTo(x-7, y-2); ctx.lineTo(x+5, y+3); ctx.stroke();
    ctx.fillStyle = '#ff9fc8';
    ctx.beginPath(); ctx.arc(x-4, y-8, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff6e8';
    ctx.beginPath(); ctx.arc(x+5, y-9, 6.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.beginPath(); ctx.arc(x+5, y-15, 2.5, 0, Math.PI*2); ctx.fill();
  } else if (pu.type === 'heart') {
    const s = 1 + Math.sin(time*6)*0.12;
    ctx.save();
    ctx.translate(x, y-2);
    ctx.scale(s, s);
    ctx.fillStyle = '#ff5090';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.bezierCurveTo(-16, -2, -10, -14, 0, -6);
    ctx.bezierCurveTo(10, -14, 16, -2, 0, 12);
    ctx.fill();
    ctx.restore();
  }
}

function drawThrownGlasses(gl) {           // ochelarii aruncați de Deni 👓
  ctx.save();
  ctx.translate(gl.x, gl.y);
  ctx.rotate(gl.spin);
  ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(-6, 0, 6, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(6, 0, 6, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(1, 0); ctx.stroke();
  ctx.restore();
}

function drawRabbit(x, y, scale, happy) {
  const bounce = Math.sin(time*6) * 6 * scale;
  const earFlop = Math.sin(time*4) * 8;
  ctx.save();
  ctx.translate(x, y + bounce);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-16, -50 + earFlop*0.2, 8, 26, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -50 - earFlop*0.2, 8, 26, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffc2d6';
  ctx.beginPath(); ctx.ellipse(-16, -50 + earFlop*0.2, 4, 18, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -50 - earFlop*0.2, 4, 18, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(0, 10, 32, 26, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -22, 24, 22, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-9, -24, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -24, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff9fc0';
  ctx.beginPath(); ctx.arc(0, -15, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c94'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.quadraticCurveTo(-6, -8, -12, -10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.quadraticCurveTo(6, -8, 12, -10); ctx.stroke();
  ctx.fillStyle = '#ffd8e6';
  ctx.beginPath(); ctx.ellipse(-16, 4, 8, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 4, 8, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawWashingMachine(x, y, scale, spinT, happy) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#e2e6ea';
  roundRect(-34, -60, 68, 60, 8); ctx.fill();
  ctx.strokeStyle = '#aab2ba'; ctx.lineWidth = 2;
  roundRect(-34, -60, 68, 60, 8); ctx.stroke();
  ctx.fillStyle = '#c7ccd1';
  ctx.fillRect(-34, -60, 68, 12);
  ctx.fillStyle = '#3b82ff';
  ctx.beginPath(); ctx.arc(-22, -54, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff5252';
  ctx.beginPath(); ctx.arc(-12, -54, 3, 0, Math.PI*2); ctx.fill();
  // hublou
  ctx.fillStyle = '#2a2f36';
  ctx.beginPath(); ctx.arc(2, -24, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7fd4ff';
  ctx.beginPath(); ctx.arc(2, -24, 18, 0, Math.PI*2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(2, -24, 18, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 5;
  const spin = (spinT || time) * 6;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.ellipse(2, -24, 14, 6, spin + i * 2.1, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
  if (happy) {                                     // fața fericită a mașinii 😊
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -28, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -28, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(2, -20, 8, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  }
  ctx.fillStyle = '#c7ccd1';
  ctx.fillRect(-30, -8, 12, 4);
  ctx.fillRect(18, -8, 12, 4);
  // baloane de săpun 🫧
  for (let i = 0; i < 5; i++) {
    const bt = ((time*0.7 + i*0.4) % 1.6);
    const bx = 2 + Math.sin(time*2 + i) * 20;
    const by = -46 - bt * 40;
    ctx.globalAlpha = Math.max(0, 1 - bt/1.6);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 3 + i%3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawEasterEgg() {
  ctx.fillStyle = 'rgba(20,15,35,.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const antonia = charIdx === 0;
  if (antonia) drawRabbit(W/2, H/2 - 10, 1.6);
  else drawWashingMachine(W/2, H/2 - 10, 1.6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 38px "Segoe UI", Arial';
  ctx.fillText(antonia ? 'Felicitări! 🎉' : 'Felicitări, Marc! 🎉', W/2, H/2 + 110);
  ctx.font = '26px "Segoe UI", Arial';
  ctx.fillText(antonia ? 'Ai salvat un iepuraș! 🐰' : 'Ai găsit o mașină de spălat! 🧺', W/2, H/2 + 150);
}

function drawFinishMove(duration) {
  const frac = Math.min(1, stateTimer / duration);
  if (!boss) return;
  const bx = boss.x + boss.w/2, by = boss.y + boss.h/2;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - frac*1.4);
  drawBoss();
  ctx.restore();
  if (charIdx === 0) {                              // Antonia: curcubeul unicornului lovește boss-ul 🌈
    if (frac < 0.7 && player) {
      const px = player.x + player.w/2, py = player.y + player.h*0.3;
      const rainbow = ['#ff5252','#ffb347','#ffe066','#69f0ae','#4dd0e1','#b388ff'];
      const arcH = 90 + Math.sin(time*10) * 8;
      for (let i = 0; i < rainbow.length; i++) {
        ctx.strokeStyle = rainbow[i]; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px, py - i*5);
        ctx.quadraticCurveTo((px+bx)/2, Math.min(py,by) - arcH - i*5, bx, by - i*5);
        ctx.stroke();
      }
    }
  } else {                                          // Marc: mașina de spălat înghite boss-ul 🧺
    const wScale = Math.min(1.4, 0.3 + frac*2.2);
    drawWashingMachine(bx, by + 30, wScale, time*(1+frac*3), frac > 0.5);
  }
}

function drawDiveMask(cx, cy, dir, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(dir * scale, scale);
  ctx.strokeStyle = '#2a2f36'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, -1); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(1, 0, 8, 6.4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3a3f44';
  ctx.fillRect(6, -1.5, 3, 3);
  ctx.restore();
}

function drawStarAura(p) {
  for (let i = 0; i < 5; i++) {
    const a = time * 5 + i * Math.PI * 2 / 5;
    const x = p.x + p.w/2 + Math.cos(a) * 34;
    const y = p.y + p.h/2 + Math.sin(a) * 34;
    ctx.fillStyle = ['#ffd700','#ff6090','#7fd4ff','#a0ff90','#ffb060'][i];
    ctx.fillRect(x-3, y-3, 6, 6);
  }
}

function drawEnemy(en) {
  const x = en.x, y = en.y, w = en.w, h = en.h;
  if (en.dead) {
    ctx.fillStyle = en.kind === 'fish' ? '#5090c0' : en.kind === 'bird' ? '#8060a0' : '#a05a2c';
    ctx.beginPath(); ctx.ellipse(x+w/2, y+h-8, w/2, 8, 0, 0, Math.PI*2); ctx.fill();
    return;
  }
  const wob = Math.sin(en.anim) * 2;
  if (en.kind === 'fish') {
    const d = en.vx < 0 ? -1 : 1;
    ctx.save();
    ctx.translate(x+w/2, y+h/2);
    ctx.scale(d, 1);
    ctx.fillStyle = '#58a0d8';
    ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a80b8';                       // coadă
    ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2-12, -10+wob); ctx.lineTo(-w/2-12, 10+wob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(w/4, -4, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(w/4+1, -4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (en.kind === 'bird') {
    const d = en.vx < 0 ? -1 : 1;
    const fl = Math.sin(en.anim*2) * 8;
    ctx.save();
    ctx.translate(x+w/2, y+h/2);
    ctx.scale(d, 1);
    ctx.fillStyle = '#8060a0';
    ctx.beginPath(); ctx.ellipse(0, 0, w/2.2, h/2.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6a4a8a';                       // aripi
    ctx.beginPath(); ctx.ellipse(-4, -8+fl*0.5, 13, 6, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffb020';                       // cioc
    ctx.beginPath(); ctx.moveTo(w/2.2, -2); ctx.lineTo(w/2.2+9, 2); ctx.lineTo(w/2.2, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(w/5, -6, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(w/5+1, -6, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = theme === 'subteran' ? '#7a5aa0' : '#a05a2c';
    ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2+wob*0.3, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = theme === 'subteran' ? '#5a3a80' : '#6a3a18';
    ctx.beginPath(); ctx.ellipse(x+10, y+h-4, 8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+w-10, y+h-4, 8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x+12, y+14+wob*0.3, 6, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+w-12, y+14+wob*0.3, 6, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(x+12, y+17+wob*0.3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w-12, y+17+wob*0.3, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x+6, y+6); ctx.lineTo(x+17, y+11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-6, y+6); ctx.lineTo(x+w-17, y+11); ctx.stroke();
  }
}

function drawBoss() {
  if (boss.dead) return;
  if (boss.kind === 'kong') return drawKong();
  if (boss.kind === 'bowzer') return drawBowzer();
  if (boss.kind === 'boo') return drawBoo();
  drawBalaur();
}

/* Konkey Kong 🦍 — gorilă cu cravată roșie */
function drawKong() {
  const b = boss, x = b.x, y = b.y, w = b.w, h = b.h;
  const flash = b.invT > 0 && Math.floor(time*14)%2===0;
  const beat = Math.sin(b.anim * 2) > 0.4;   // își bate pieptul
  const d = b.vx < 0 ? -1 : 1;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  ctx.scale(d, 1);
  const fur = flash ? '#fff' : '#6b4326';
  const skin2 = flash ? '#eee' : '#c8a078';
  // picioare
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(-w/4, -12, 20, 14, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w/4, -12, 20, 14, 0, 0, Math.PI*2); ctx.fill();
  // corp masiv
  ctx.beginPath(); ctx.ellipse(0, -h/2, w/2 - 8, h/2 - 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin2;   // piept
  ctx.beginPath(); ctx.ellipse(2, -h/2 + 8, w/3.2, h/2.6, 0, 0, Math.PI*2); ctx.fill();
  // brațe groase (unul bate pieptul)
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(-w/2 + 8, -h/2 + (beat ? -6 : 8), 16, 30, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w/2 - 8, -h/2 + (beat ? 8 : -6), 16, 30, -0.4, 0, Math.PI*2); ctx.fill();
  // cravată roșie
  ctx.fillStyle = flash ? '#fff' : '#e63946';
  ctx.beginPath(); ctx.moveTo(-7, -h + 34); ctx.lineTo(7, -h + 34); ctx.lineTo(3, -h + 62); ctx.lineTo(-3, -h + 62); ctx.closePath(); ctx.fill();
  // cap
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(6, -h + 16, 26, 22, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin2;   // față
  ctx.beginPath(); ctx.ellipse(12, -h + 20, 18, 15, 0, 0, Math.PI*2); ctx.fill();
  // moț de păr
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.moveTo(0, -h - 4); ctx.lineTo(6, -h - 14); ctx.lineTo(12, -h - 4); ctx.closePath(); ctx.fill();
  // ochi încruntați
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(8, -h + 14, 5, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20, -h + 14, 5, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a2010';
  ctx.beginPath(); ctx.arc(9, -h + 16, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(21, -h + 16, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(3, -h + 7); ctx.lineTo(14, -h + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(26, -h + 7); ctx.lineTo(16, -h + 10); ctx.stroke();
  // gură
  ctx.fillStyle = '#7a4a3a';
  ctx.beginPath(); ctx.ellipse(14, -h + 28, 9, 4 + (beat ? 2 : 0), 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Bowzer 🐢🔥 — țestoasă cu țepi */
function drawBowzer() {
  const b = boss, x = b.x, y = b.y, w = b.w, h = b.h;
  const flash = b.invT > 0 && Math.floor(time*14)%2===0;
  const wob = Math.sin(b.anim) * 3;
  const d = b.vx < 0 ? -1 : 1;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  ctx.scale(d, 1);
  const shell = flash ? '#fff' : '#3a8a3a';
  const body = flash ? '#eee' : '#e8c86a';
  // picioare
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(-w/4, -10, 17, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w/4 - 6, -10, 17, 12, 0, 0, Math.PI*2); ctx.fill();
  // carapace cu țepi
  ctx.fillStyle = shell;
  ctx.beginPath(); ctx.ellipse(-8, -h/2 + 4 + wob*0.3, w/2 - 10, h/2 - 14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = flash ? '#ddd' : '#f6f3ee';
  for (let i = 0; i < 4; i++) {
    const sx = -w/2 + 14 + i * 20;
    ctx.beginPath();
    ctx.moveTo(sx, -h + 26 + wob*0.3); ctx.lineTo(sx + 9, -h + 4 + wob*0.3); ctx.lineTo(sx + 18, -h + 26 + wob*0.3);
    ctx.closePath(); ctx.fill();
  }
  // burtă
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(8, -h/2 + 12 + wob*0.3, w/3.4, h/2.8, 0, 0, Math.PI*2); ctx.fill();
  // cap
  ctx.beginPath(); ctx.ellipse(w/2 - 18, -h + 26 + wob*0.3, 24, 20, 0, 0, Math.PI*2); ctx.fill();
  // păr roșu țepos
  ctx.fillStyle = flash ? '#fff' : '#e6552a';
  for (let i = 0; i < 3; i++) {
    const sx = w/2 - 34 + i * 11;
    ctx.beginPath(); ctx.moveTo(sx, -h + 10 + wob*0.3); ctx.lineTo(sx + 5, -h - 4 + wob*0.3); ctx.lineTo(sx + 10, -h + 10 + wob*0.3); ctx.closePath(); ctx.fill();
  }
  // corniță albă
  ctx.fillStyle = flash ? '#ddd' : '#f6f3ee';
  ctx.beginPath(); ctx.moveTo(w/2 - 38, -h + 16 + wob*0.3); ctx.lineTo(w/2 - 34, -h + 4 + wob*0.3); ctx.lineTo(w/2 - 28, -h + 16 + wob*0.3); ctx.closePath(); ctx.fill();
  // ochi furios
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(w/2 - 16, -h + 20 + wob*0.3, 6, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c02020';
  ctx.beginPath(); ctx.arc(w/2 - 14, -h + 22 + wob*0.3, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5a2a10'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(w/2 - 26, -h + 12 + wob*0.3); ctx.lineTo(w/2 - 8, -h + 16 + wob*0.3); ctx.stroke();
  // bot + foc la nări
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(w/2 - 2, -h + 32 + wob*0.3, 12, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = flash ? '#eee' : '#ff8030';
  ctx.beginPath(); ctx.arc(w/2 + 10, -h + 30 + wob*0.3, 3 + Math.abs(Math.sin(time*7))*4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Regele Bu 👻 — fantomă cu coroană */
function drawBoo() {
  const b = boss, x = b.x, y = b.y, w = b.w, h = b.h;
  const flash = b.invT > 0 && Math.floor(time*14)%2===0;
  const d = b.vx < 0 ? -1 : 1;
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  ctx.scale(d, 1);
  ctx.globalAlpha = flash ? 1 : 0.92;
  // corp fantomă
  ctx.fillStyle = flash ? '#ffd' : '#f4f2ff';
  ctx.beginPath(); ctx.arc(0, -4, w/2 - 4, Math.PI, 0);
  ctx.lineTo(w/2 - 4, h/2 - 14);
  for (let i = 0; i < 5; i++) {
    const sx = w/2 - 4 - (i+0.5) * (w-8)/5;
    ctx.quadraticCurveTo(sx + (w-8)/10, h/2 - (i%2 ? 2 : 26), sx - (w-8)/10, h/2 - 14);
  }
  ctx.closePath(); ctx.fill();
  // brațe mici
  ctx.beginPath(); ctx.ellipse(-w/2 + 4, 0, 10, 7, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w/2 - 4, 0, 10, 7, -0.5, 0, Math.PI*2); ctx.fill();
  // coroană de aur
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#fff' : '#ffd23f';
  ctx.beginPath();
  ctx.moveTo(-16, -h/2 + 8); ctx.lineTo(-16, -h/2 - 8); ctx.lineTo(-9, -h/2); ctx.lineTo(-2, -h/2 - 10);
  ctx.lineTo(5, -h/2); ctx.lineTo(12, -h/2 - 8); ctx.lineTo(12, -h/2 + 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.arc(-2, -h/2 + 2, 3, 0, Math.PI*2); ctx.fill();
  // ochi răutăcioși
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(2, -14, 5, 8, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20, -14, 5, 8, 0.2, 0, Math.PI*2); ctx.fill();
  // gură mare cu limbă
  ctx.fillStyle = '#5a1a2a';
  ctx.beginPath(); ctx.ellipse(12, 6, 16, 10 + Math.sin(b.anim)*2, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#ff6080';
  ctx.beginPath(); ctx.ellipse(14, 12, 8, 5, 0, 0, Math.PI); ctx.fill();
  ctx.restore();
}

function drawBalaur() {
  const b = boss;
  const x = b.x, y = b.y, w = b.w, h = b.h;
  const flash = b.invT > 0 && Math.floor(time*14)%2===0;
  const wob = Math.sin(b.anim) * 3;
  const d = b.vx < 0 ? -1 : 1;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  ctx.scale(d, 1);
  const body = flash ? '#fff' : '#7a3aa0';
  const belly = flash ? '#eee' : '#b088cc';
  // coadă
  ctx.strokeStyle = body; ctx.lineWidth = 16;
  ctx.beginPath();
  ctx.moveTo(-w/2+14, -34);
  ctx.quadraticCurveTo(-w/2-26, -46, -w/2-20, -76 + wob);
  ctx.stroke();
  ctx.fillStyle = flash ? '#fff' : '#e63946';
  ctx.beginPath(); ctx.moveTo(-w/2-30, -84+wob); ctx.lineTo(-w/2-6, -78+wob); ctx.lineTo(-w/2-20, -62+wob); ctx.closePath(); ctx.fill();
  // picioare
  ctx.fillStyle = flash ? '#ddd' : '#5a2a78';
  ctx.beginPath(); ctx.ellipse(-w/4, -8, 16, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w/4, -8, 16, 10, 0, 0, Math.PI*2); ctx.fill();
  // corp
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, -h/2+6+wob*0.4, w/2-6, h/2-12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(6, -h/2+14+wob*0.4, w/3.4, h/2-22, 0, 0, Math.PI*2); ctx.fill();
  // țepi pe spate
  ctx.fillStyle = flash ? '#fff' : '#e63946';
  for (let i = 0; i < 4; i++) {
    const sx = -w/2 + 16 + i*22;
    ctx.beginPath();
    ctx.moveTo(sx, -h+18+wob*0.4); ctx.lineTo(sx+10, -h-2+wob*0.4); ctx.lineTo(sx+20, -h+18+wob*0.4);
    ctx.closePath(); ctx.fill();
  }
  // cap
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(w/2-16, -h+18+wob*0.3, 26, 22, 0, 0, Math.PI*2); ctx.fill();
  // bot
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(w/2+4, -h+26+wob*0.3, 14, 10, 0, 0, Math.PI*2); ctx.fill();
  // coarne
  ctx.fillStyle = flash ? '#fff' : '#ffd23f';
  ctx.beginPath(); ctx.moveTo(w/2-32, -h+2+wob*0.3); ctx.lineTo(w/2-26, -h-16+wob*0.3); ctx.lineTo(w/2-18, -h+2+wob*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w/2-12, -h+wob*0.3); ctx.lineTo(w/2-6, -h-14+wob*0.3); ctx.lineTo(w/2+2, -h+wob*0.3); ctx.closePath(); ctx.fill();
  // ochi supărat
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(w/2-12, -h+14+wob*0.3, 7, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c02020';
  ctx.beginPath(); ctx.arc(w/2-10, -h+16+wob*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = flash ? '#ccc' : '#3a1a50'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(w/2-24, -h+4+wob*0.3); ctx.lineTo(w/2-4, -h+10+wob*0.3); ctx.stroke();
  // nări/foc mic
  ctx.fillStyle = flash ? '#eee' : '#ff8030';
  ctx.beginPath(); ctx.arc(w/2+16, -h+24+wob*0.3, 3 + Math.abs(Math.sin(time*7))*3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function bossEmoji(kind) {
  return kind === 'kong' ? '🦍' : kind === 'bowzer' ? '🐢' : kind === 'boo' ? '👻' : '🐉';
}
function bossTitle() {
  const mb = LEVELS[levelIdx] && LEVELS[levelIdx].miniboss;
  return mb ? mb.title.toUpperCase() : 'BALAURUL';
}
function drawBossBar() {
  if (!boss) return;
  const bw = 420, bx = W/2 - bw/2, by = 76;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRect(bx-8, by-8, bw+16, 34, 10); ctx.fill();
  ctx.fillStyle = '#552';
  roundRect(bx, by, bw, 18, 8); ctx.fill();
  const frac = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#5cb85c' : frac > 0.25 ? '#f0a020' : '#e63946';
  if (frac > 0) { roundRect(bx, by, bw*frac, 18, 8); ctx.fill(); }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Segoe UI", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bossEmoji(boss.kind) + ' ' + bossTitle(), W/2, by - 18);
}

/* ---------- personaje ---------- */
function drawKid(cx, footY, cfg, h, dir, anim, jumping, wings) {
  const alt = state !== 'select' && LEVELS[levelIdx] && LEVELS[levelIdx].altMount;
  if (cfg.mount === 'unicorn') return alt ? drawSkaterRider(cx, footY, cfg, h, dir, anim, jumping, wings)
                                          : drawUnicornRider(cx, footY, cfg, h, dir, anim, jumping, wings);
  if (cfg.mount === 'police')  return alt ? drawScooterRider(cx, footY, cfg, h, dir, anim, jumping, wings)
                                          : drawPoliceRider(cx, footY, cfg, h, dir, anim, jumping, wings);
  drawKidOnFoot(cx, footY, cfg, h, dir, anim, jumping);
}

/* Antonia pe role 🛼 */
function drawSkaterRider(cx, footY, cfg, h, dir, anim, jumping, wings) {
  const u = h / 16;
  const glide = jumping ? 0.6 : Math.sin(anim * Math.PI) * 0.7;
  ctx.save();
  ctx.translate(cx, footY);
  ctx.scale(dir, 1);
  if (wings) drawMountWings(u, -8*u);
  // picioare
  ctx.fillStyle = cfg.pants;
  ctx.fillRect(-2.4*u + glide*0.5*u, -5.6*u, 2*u, 3.6*u);
  ctx.fillRect(0.6*u - glide*0.5*u, -5.6*u, 2*u, 3.6*u);
  // ghete de role roz
  ctx.fillStyle = '#ff8fb5';
  ctx.fillRect(-2.7*u + glide*0.5*u, -2.4*u, 2.6*u, 1.7*u);
  ctx.fillRect(0.3*u - glide*0.5*u, -2.4*u, 2.6*u, 1.7*u);
  // rotițe
  ctx.fillStyle = '#8a4aa0';
  for (const off of [-2.3*u + glide*0.5*u, -1.1*u + glide*0.5*u, 0.7*u - glide*0.5*u, 1.9*u - glide*0.5*u]) {
    ctx.beginPath(); ctx.arc(off, -0.35*u, 0.42*u, 0, Math.PI*2); ctx.fill();
  }
  // corp + braț de echilibru
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-3*u, -11*u, 6*u, 5.6*u);
  ctx.fillRect(2.8*u, -10.8*u, 2.2*u, 1.1*u);
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(5*u, -10.9*u, 1.1*u, 1.2*u);
  // cap: păr blond lung + bentiță cu urechi 🐱
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-2.8*u, -17*u, 5.4*u, 6.2*u);
  ctx.fillStyle = cfg.hairColor;
  ctx.fillRect(-3.8*u, -16.8*u, 1.3*u, 8.4*u);
  ctx.fillRect(-3.2*u, -17.4*u, 6*u, 1.7*u);
  ctx.fillStyle = '#ff8fb5';
  ctx.fillRect(-3.2*u, -17.8*u, 6*u, 0.8*u);
  ctx.beginPath(); ctx.moveTo(-2.6*u,-17.6*u); ctx.lineTo(-1.8*u,-19.5*u); ctx.lineTo(-0.8*u,-17.7*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.7*u,-17.7*u); ctx.lineTo(1.6*u,-19.5*u); ctx.lineTo(2.4*u,-17.6*u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffc2d6';
  ctx.beginPath(); ctx.moveTo(-2.2*u,-17.8*u); ctx.lineTo(-1.8*u,-18.9*u); ctx.lineTo(-1.2*u,-17.8*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1.1*u,-17.8*u); ctx.lineTo(1.6*u,-18.9*u); ctx.lineTo(2*u,-17.8*u); ctx.closePath(); ctx.fill();
  // față
  ctx.fillStyle = '#222';
  ctx.fillRect(-0.2*u, -15*u, 0.9*u, 1.1*u);
  ctx.fillRect(1.4*u, -15*u, 0.9*u, 1.1*u);
  ctx.fillStyle = '#c96b5c';
  ctx.fillRect(0.4*u, -12.7*u, 1*u, 0.4*u);
  ctx.restore();
}

/* Marc pe trotinetă 🛴 */
function drawScooterRider(cx, footY, cfg, h, dir, anim, jumping, wings) {
  const u = h / 16;
  const bob = jumping ? -0.4 : Math.sin(anim*2)*0.2;
  ctx.save();
  ctx.translate(cx, footY + bob*u);
  ctx.scale(dir, 1);
  if (wings) drawMountWings(u, -6*u);
  // roți
  ctx.fillStyle = '#22262a';
  ctx.beginPath(); ctx.arc(-2.6*u, -0.9*u, 0.95*u, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4*u, -0.9*u, 0.95*u, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#9aa3ab';
  ctx.beginPath(); ctx.arc(-2.6*u, -0.9*u, 0.4*u, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4*u, -0.9*u, 0.4*u, 0, Math.PI*2); ctx.fill();
  // placă + ghidon
  ctx.fillStyle = '#2255cc';
  ctx.fillRect(-2.8*u, -2*u, 5.6*u, 0.8*u);
  ctx.strokeStyle = '#3a6fd8'; ctx.lineWidth = 0.6*u;
  ctx.beginPath(); ctx.moveTo(3.2*u, -1.6*u); ctx.lineTo(4.3*u, -9.6*u); ctx.stroke();
  ctx.strokeStyle = '#22262a'; ctx.lineWidth = 0.55*u;
  ctx.beginPath(); ctx.moveTo(3.5*u, -9.8*u); ctx.lineTo(5*u, -9.8*u); ctx.stroke();
  // picioare pe placă
  ctx.fillStyle = cfg.pants;
  ctx.fillRect(-1.6*u, -5.4*u, 1.9*u, 3.4*u);
  ctx.fillRect(0.4*u, -5.2*u, 1.9*u, 3.2*u);
  ctx.fillStyle = cfg.shoes;
  ctx.fillRect(-1.8*u, -2.8*u, 2.4*u, 1*u);
  ctx.fillRect(0.2*u, -2.6*u, 2.4*u, 0.9*u);
  // corp + brațe spre ghidon
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-2*u, -11*u, 4.2*u, 5.8*u);
  ctx.fillRect(1.6*u, -10.6*u, 2.4*u, 1.1*u);
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(3.8*u, -10.7*u, 1.1*u, 1.2*u);
  // cap cu păr ciufulit + ochelari
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-2.2*u, -16.4*u, 4.8*u, 5.4*u);
  ctx.fillStyle = cfg.hairColor;
  ctx.fillRect(-2.5*u, -17*u, 5.4*u, 1.8*u);
  ctx.fillRect(-2.1*u, -17.7*u, 1.3*u, 1*u);
  ctx.fillRect(0, -18*u, 1.4*u, 1.4*u);
  ctx.fillRect(1.7*u, -17.6*u, 1.1*u, 1*u);
  ctx.fillStyle = '#222';
  ctx.fillRect(-0.1*u, -14.6*u, 0.8*u, 1*u);
  ctx.fillRect(1.4*u, -14.6*u, 0.8*u, 1*u);
  ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 0.3*u;
  ctx.beginPath(); ctx.arc(0.3*u, -14.2*u, 1*u, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(1.8*u, -14.2*u, 1*u, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#c96b5c';
  ctx.fillRect(0.5*u, -12.2*u, 0.95*u, 0.38*u);
  ctx.restore();
}

function drawMountWings(u, y0) {

function drawUnicornRider(cx, footY, cfg, h, dir, anim, jumping, wings) {
  const u = h / 16;

    ctx.moveTo(-4.4*u, -7.4*u + i*0.5*u);

  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.moveTo(4.5*u, -12.5*u); ctx.lineTo(5.5*u, -12.3*u); ctx.lineTo(5.6*u, -15.2*u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fdfbf7';
  ctx.beginPath(); ctx.moveTo(3.9*u, -12.5*u); ctx.lineTo(4.4*u, -13.5*u); ctx.lineTo(4.8*u, -12.4*u); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 3; i++) {

  }

  ctx.fillStyle = cfg.pants;

  ctx.fillRect(2.9*u, -12.8*u, 1.2*u, 1.4*u);
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-2.6*u, -18.2*u, 4.6*u, 5.3*u);
  ctx.fillStyle = cfg.hairColor;
  ctx.fillRect(-3.4*u, -18*u, 1.2*u, 7.2*u);
  ctx.fillRect(-2.9*u, -18.6*u, 5.2*u, 1.6*u);
  ctx.fillStyle = '#ff8fb5';
  ctx.fillRect(-2.9*u, -19*u, 5.2*u, 0.8*u);
  ctx.beginPath(); ctx.moveTo(-2.4*u, -18.8*u); ctx.lineTo(-1.6*u, -20.7*u); ctx.lineTo(-0.6*u, -18.9*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.6*u, -18.9*u); ctx.lineTo(1.5*u, -20.7*u); ctx.lineTo(2.3*u, -18.8*u); ctx.closePath(); ctx.fill();

function drawKidOnFoot(cx, footY, cfg, h, dir, anim, jumping, punching) {
  const u = h / 16;
  const legSwing = jumping ? 0.8 : Math.sin(anim * Math.PI) * 0.9;
  ctx.save();
  ctx.translate(cx, footY);
  ctx.scale(dir, 1);

  ctx.fillStyle = cfg.pants;
  ctx.fillRect(-2.6*u + legSwing*u, -5*u, 2.2*u, 3.6*u);
  ctx.fillRect(0.4*u - legSwing*u, -5*u, 2.2*u, 3.6*u);
  ctx.fillStyle = cfg.shoes;
  ctx.fillRect(-2.8*u + legSwing*u, -1.6*u, 2.8*u, 1.6*u);
  ctx.fillRect(0.2*u - legSwing*u, -1.6*u, 2.8*u, 1.6*u);

  const bw = cfg.buff ? 7*u : 6*u;        // piept mai lat pentru cei musculoși 💪
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-bw/2, -10*u, bw, 5.4*u);
  const armSwing = jumping ? -1.5 : Math.sin(anim * Math.PI + Math.PI) * 0.8;
  ctx.fillStyle = cfg.shirt;
  const aw = cfg.buff ? 2.1*u : 1.6*u;
  ctx.fillRect(bw/2 - 0.4*u, -10*u, aw, cfg.buff ? 1.6*u : 3*u);
  ctx.fillStyle = cfg.skin;
  if (cfg.buff) {
    if (punching) {                                                     // pumn drept, de la umăr 👊
      const reach = 6*u;
      ctx.fillRect(bw/2 - 0.4*u, -9.6*u, aw + reach, 2*u);
      if (cfg.tattoo) {
        ctx.fillStyle = 'rgba(70,58,78,.85)';
        ctx.fillRect(bw/2 - 0.1*u, -9.3*u, 1.4*u, 1.3*u);
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bw/2 - 0.4*u + aw + reach, -8.6*u, 1*u, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(bw/2 - 0.4*u, -8.5*u, aw, 2.6*u);                    // braț musculos
      if (cfg.tattoo) {
        ctx.fillStyle = 'rgba(70,58,78,.85)';                            // tatuaj
        ctx.fillRect(bw/2 - 0.1*u, -8.2*u, 1.4*u, 1.3*u);
        ctx.fillStyle = cfg.skin;
      }
      ctx.fillRect(bw/2 - 0.2*u, -6*u + armSwing*u*0.5, aw - 0.4*u, 1.5*u);
    }
  } else {
    const throwLift = punching ? -3.4*u : armSwing*u*0.5;              // brațul se ridică să arunce 👓
    ctx.fillRect(2.6*u, -7.2*u + throwLift, 1.6*u, 1.6*u);
  }

  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-3.2*u, -16*u, 6.4*u, 6.2*u);
  ctx.fillStyle = cfg.hairColor;
  if (cfg.hair === 'codite') {
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 2.4*u);
    ctx.fillRect(-4.6*u, -15*u, 1.4*u, 4.5*u);
    ctx.fillRect(3.2*u, -15*u, 1.4*u, 4.5*u);
    ctx.fillStyle = '#e63985';
    ctx.fillRect(-4.6*u, -11*u, 1.4*u, 0.8*u); ctx.fillRect(3.2*u, -11*u, 1.4*u, 0.8*u);
  } else if (cfg.hair === 'ciufulit') {
    ctx.fillRect(-3.6*u, -16.8*u, 7.2*u, 2.2*u);
    ctx.fillRect(-3.2*u, -17.6*u, 1.6*u, 1.2*u);
    ctx.fillRect(-0.6*u, -18*u, 1.6*u, 1.6*u);
    ctx.fillRect(1.8*u, -17.4*u, 1.4*u, 1.2*u);
    ctx.fillRect(-3.6*u, -15*u, 1*u, 2*u);
  } else if (cfg.hair === 'breton') {
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 3.2*u);
    ctx.fillRect(-3.6*u, -14*u, 1.2*u, 3*u);
    ctx.fillRect(2.4*u, -14*u, 1.2*u, 3*u);
  } else if (cfg.hair === 'lung') {
    if (cfg.hairRoots) {                                  // rădăcini mai închise (balayage)
      ctx.fillStyle = cfg.hairRoots;
      ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 1.3*u);
      ctx.fillStyle = cfg.hairColor;
      ctx.fillRect(-3.6*u, -15.3*u, 7.2*u, 0.9*u);
    } else {
      ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 2.2*u);
    }
    ctx.fillRect(-4.3*u, -16*u, 1.3*u, 8*u);
    ctx.fillRect(-3.6*u, -15*u, 0.9*u, 3*u);
  } else if (cfg.hair === 'ridicat') {                    // păr scurt pieptănat în sus
    ctx.fillRect(-3.4*u, -16.8*u, 6.8*u, 1.6*u);
    ctx.fillRect(0.6*u, -17.9*u, 2.6*u, 1.5*u);           // moț ridicat în față
    ctx.fillRect(-3.4*u, -15.4*u, 0.8*u, 1*u);
  } else {
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 2.2*u);
    ctx.fillRect(-3.6*u, -15*u, 1*u, 1.6*u);
  }

  ctx.fillStyle = '#222';
  ctx.fillRect(0.4*u, -13.6*u, 1*u, 1.3*u);
  ctx.fillRect(2.2*u, -13.6*u, 1*u, 1.3*u);
  if (cfg.glasses) {
    ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 0.3*u;
    ctx.beginPath(); ctx.arc(0.9*u, -13*u, 1.1*u, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(2.7*u, -13*u, 1.1*u, 0, Math.PI*2); ctx.stroke();
  }
  if (cfg.beard) {                                        // barbă scurtă
    ctx.fillStyle = '#8a6d42';
    ctx.fillRect(-3.2*u, -11.3*u, 6.4*u, 1.5*u);
  }
  ctx.fillStyle = '#d8886a';
  ctx.fillRect(1.4*u, -12*u, 0.8*u, 0.8*u);
  ctx.fillStyle = '#c96b5c';
  ctx.fillRect(0.9*u, -10.9*u, 1.6*u, 0.55*u);

  ctx.restore();
}

function drawFlag() {
  const x = flagX;
  const groundY = 11 * TILE;
  ctx.fillStyle = '#3aa03a';
  ctx.fillRect(x-4, groundY - TILE*6, 8, TILE*6);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(x, groundY - TILE*6, 10, 0, Math.PI*2); ctx.fill();
  const wave = Math.sin(time*3)*6;
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(x+4, groundY - TILE*6 + 10);
  ctx.lineTo(x+4 + 60, groundY - TILE*6 + 30 + wave);
  ctx.lineTo(x+4, groundY - TILE*6 + 50);
  ctx.closePath(); ctx.fill();
}

function drawCheckpoint(cp) {
  const x = cp.x, groundY = 11 * TILE;
  ctx.fillStyle = '#9aa3ab';
  ctx.fillRect(x-3, groundY - TILE*3, 6, TILE*3);
  const wave = Math.sin(time*3 + x) * 5;
  ctx.fillStyle = cp.taken ? '#3ab0ff' : 'rgba(154,163,171,.6)';
  ctx.beginPath();
  ctx.moveTo(x+3, groundY - TILE*3 + 6);
  ctx.lineTo(x+3 + 34, groundY - TILE*3 + 20 + wave);
  ctx.lineTo(x+3, groundY - TILE*3 + 34);
  ctx.closePath(); ctx.fill();
  if (cp.taken) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✓', x, groundY - TILE*3 - 10);
  }
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 6; i++) {
    const cx2 = ((i * 420 + 100 - camX*0.3) % (W + 400)) - 200;
    const cy = 60 + (i%3)*55;
    ctx.beginPath();
    ctx.arc(cx2, cy, 26, 0, Math.PI*2);
    ctx.arc(cx2+30, cy-8, 32, 0, Math.PI*2);
    ctx.arc(cx2+62, cy, 26, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawHills() {
  ctx.fillStyle = '#7ec850';
  for (let i = 0; i < 5; i++) {
    const hx = ((i * 500 + 50 - camX*0.5) % (W + 600)) - 300;
    ctx.beginPath();
    ctx.arc(hx, H - 24, 130, Math.PI, 0);
