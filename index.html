<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Aventura</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1a2e; touch-action:none;
    font-family:'Segoe UI', Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#5c94fc; image-rendering:pixelated; max-width:100%; max-height:100%;
    box-shadow:0 0 40px rgba(0,0,0,.6); border-radius:6px; }
  /* Butoane touch */
  .tbtn { position:fixed; bottom:4vh; width:17vmin; height:17vmin; min-width:64px; min-height:64px;
    border-radius:50%; background:rgba(255,255,255,.18); border:3px solid rgba(255,255,255,.45);
    color:#fff; font-size:7vmin; display:none; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; z-index:10; }
  .tbtn.pressed { background:rgba(255,255,255,.45); }
  #btnL { left:4vw; }
  #btnR { left:calc(4vw + 19vmin); }
  #btnJ { right:4vw; background:rgba(255,80,80,.25); border-color:rgba(255,120,120,.6); }
  body.touch .tbtn { display:flex; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1024" height="576"></canvas></div>
<div class="tbtn" id="btnL">◀</div>
<div class="tbtn" id="btnR">▶</div>
<div class="tbtn" id="btnJ">⬆</div>

<script>
'use strict';

/* ============================================================
   PERSONAJE — aici le personalizezi după copiii tăi! 🎨
   Poți schimba: numele, culorile (păr, piele, tricou, pantaloni),
   hair: 'scurt' | 'ciufulit' | 'codite' | 'breton'
   scale: mărimea personajului (1 = normal, 0.85 = mai mic)
   ============================================================ */
const CHARACTERS = [
  {
    name: 'Antonia',
    emoji: '🦄',
    mount: 'unicorn',          // calare pe unicorn
    hair: 'lung',
    hairColor: '#f2d382',      // blond
    skin: '#ffdcc0',
    shirt: '#f8b8d0',          // roz Hello Kitty
    pants: '#b9dcd2',          // colanti verzui-deschis
    shoes: '#fff',
    scale: 1.0,
  },
  {
    name: 'Marc',
    emoji: '🚓',
    mount: 'police',           // in masinuta de politie
    hair: 'ciufulit',
    hairColor: '#c9a97a',      // saten deschis
    skin: '#ffe0c2',
    glasses: true,             // ochelari rotunzi
    shirt: '#f2ead8',          // tricou crem
    pants: '#555a5e',
    shoes: '#7cc3ea',
    scale: 0.85,
  },
];

/* ================= CONSTANTE JOC ================= */
const TILE = 48;
const GRAV = 2300;
const MOVE_ACC = 2400;
const MOVE_MAX = 300;
const FRICTION = 2200;
const JUMP_V = 860;
const ENEMY_SPD = 70;
const COYOTE = 0.12;
const JUMP_BUFFER = 0.12;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const ROWS = 12;

/* ================= NIVELURI =================
   # = pământ   B = cărămidă   Q = bloc ?   = = platformă
   C = monedă   E = inamic     P = start    F = steag
   . = gol
*/
const LEVELS = [
[ // ------- Nivelul 1: Câmpia Veselă -------
'............................................................................................................',
'............................................................................................................',
'............................................................................................................',
'..........................C.C.C............................................................................',
'..........................BQB..............CCC..................BBQB.......................................',
'...............................................................................C...........................',
'.......................................====..........Q........................===..........................',
'..........C.C..............................................................................................',
'..........BQB.........E..........E................BB.....C.C.C.......E...E...........C.C..........F........',
'..............................................=====......................................................',
'..P.......................................................CCC.............................................',
'##############################...#########################...####################...########################',
],
[ // ------- Nivelul 2: Munții Cărămizilor -------
'............................................................................................................',
'............................................................................................................',
'.....................CCC....................................................................................',
'.....................BBB..............C..............BQBQB.................................................',
'....................................===....................................C.C.C..........................',
'..............Q...........................E....................===........=====...........................',
'..........................BB..........======..............................................................',
'.........C........E......BBBB......................C..C...........E....E..................................',
'........===..............BBBBB....................====....................................C........F......',
'..................................................................BBB....................===..............',
'..P...........E..........................CCC..................E...........................................',
'################...##########################...############################...#############################',
],
[ // ------- Nivelul 3: Castelul Final -------
'............................................................................................................',
'............................................................................................................',
'..............C.C.C........................................................................................',
'..............=====...............BQB...........C...C...C..................................................',
'.........................................................................BBBB..............................',
'.......Q..................E.............................===.....===.......................................',
'......................=======.............................................................................',
'..........C.C..............................====......E....................................................',
'..........BBB.........E...........C.................====......E................C.C.C...........F..........',
'...............................=====......................................................................',
'..P.................E.....................E................CCC.............E..............................',
'##################...##############...##################...##############################...################',
],
];
const LEVEL_NAMES = ['Câmpia Veselă 🌻', 'Munții Cărămizilor 🧱', 'Castelul Final 🏰'];

/* ================= SUNETE (WebAudio) ================= */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(freq, dur, type='square', vol=0.15, slide=0) {
  try {
    const ac = audio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}
const sfx = {
  jump()  { beep(300, 0.18, 'square', 0.12, 250); },
  coin()  { beep(900, 0.08, 'square', 0.12); setTimeout(()=>beep(1200,0.15,'square',0.12), 70); },
  stomp() { beep(200, 0.12, 'triangle', 0.2, -120); },
  hurt()  { beep(200, 0.3, 'sawtooth', 0.12, -150); },
  block() { beep(150, 0.08, 'square', 0.15); },
  flag()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'square',0.12), i*130)); },
  win()   { [523,659,784,880,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'triangle',0.15), i*160)); },
};

/* ================= STARE JOC ================= */
let state = 'select';        // select | play | dead | levelend | win
let charIdx = 0;
let levelIdx = 0;
let grid = [];               // matrice de tile-uri
let levelW = 0;
let player = null;
let enemies = [];
let coins = [];
let particles = [];
let popups = [];             // monede care sar din blocuri
let camX = 0;
let score = 0;
let lives = 3;
let time = 0;
let stateTimer = 0;
let flagX = 0;
let selHover = 0;

/* ================= INPUT ================= */
const keys = {};
let jumpBufferT = 0;
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  if (!keys[k] && (k===' '||k==='arrowup'||k==='w')) jumpBufferT = JUMP_BUFFER;
  keys[k] = true;
  handleMenuKey(e.key);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function inputLeft()  { return keys['arrowleft'] || keys['a'] || touchState.L; }
function inputRight() { return keys['arrowright'] || keys['d'] || touchState.R; }

/* Touch */
const touchState = { L:false, R:false, J:false };
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
// plasă de siguranță: dacă detectarea de mai sus dă greș, prima atingere reală afișează butoanele
addEventListener('pointerdown', e => { if (e.pointerType === 'touch') document.body.classList.add('touch'); }, true);
function bindBtn(id, down, up) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); el.classList.add('pressed'); down(); };
  const off = e => { e.preventDefault(); el.classList.remove('pressed'); up(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindBtn('btnL', ()=>touchState.L=true, ()=>touchState.L=false);
bindBtn('btnR', ()=>touchState.R=true, ()=>touchState.R=false);
bindBtn('btnJ', ()=>{ touchState.J = true; jumpBufferT = JUMP_BUFFER; if (state!=='play') handleMenuKey('Enter'); }, ()=>{ touchState.J = false; });

cv.addEventListener('pointerdown', e => {
  audio();
  if (state === 'select') {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    selHover = x < W/2 ? 0 : 1;
    chooseChar(selHover);
  } else if (state !== 'play') {
    handleMenuKey('Enter');
  }
});

function handleMenuKey(key) {
  audio();
  if (state === 'select') {
    if (key === 'ArrowLeft' || key.toLowerCase?.() === 'a') selHover = 0;
    if (key === 'ArrowRight' || key.toLowerCase?.() === 'd') selHover = 1;
    if (key === 'Enter' || key === ' ') chooseChar(selHover);
    if (key === '1') chooseChar(0);
    if (key === '2') chooseChar(1);
  } else if (state === 'win' && (key === 'Enter' || key === ' ')) {
    if (stateTimer > 1) { state = 'select'; score = 0; lives = 3; levelIdx = 0; }
  }
}
function chooseChar(i) {
  charIdx = i;
  score = 0; lives = 3; levelIdx = 0;
  loadLevel(0);
  state = 'play';
}

/* ================= NIVEL ================= */
function loadLevel(idx) {
  const rows = LEVELS[idx];
  levelW = rows[0].length;
  grid = [];
  enemies = []; coins = []; particles = []; popups = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < levelW; c++) {
      const ch = (rows[r] && rows[r][c]) || '.';
      let t = 0;
      if (ch === '#') t = 1;
      else if (ch === 'B') t = 2;
      else if (ch === 'Q') t = 3;
      else if (ch === '=') t = 4;
      else if (ch === 'C') { coins.push({ c, r, taken:false, anim: Math.random()*6 }); }
      else if (ch === 'E') { enemies.push(makeEnemy(c*TILE, r*TILE)); }
      else if (ch === 'P') { spawnPlayer(c*TILE, r*TILE); }
      else if (ch === 'F') { flagX = c*TILE + TILE/2; }
      grid[r][c] = t;
    }
  }
  camX = Math.max(0, player.x - W/3);
}
function makeEnemy(x, y) {
  return { x, y: y + TILE - 40, w:40, h:40, vx: -ENEMY_SPD, vy:0, onGround:false, dead:false, deadT:0, anim:Math.random()*6 };
}
function spawnPlayer(x, y) {
  const cfg = CHARACTERS[charIdx];
  const h = Math.round(58 * cfg.scale), w = Math.round(30 * cfg.scale);
  player = { x, y: y + TILE - h, w, h, vx:0, vy:0, onGround:false, coyote:0,
    dir:1, anim:0, invuln:0 };
}

function tileAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= levelW) return 1;      // pereți la margini
  if (r < 0) return 0;
  if (r >= ROWS) return 0;                 // jos = gol (cazi)
  return grid[r][c];
}
function solidForBody(t)   { return t === 1 || t === 2 || t === 3 || t === 5; }
function solidTop(t)       { return solidForBody(t) || t === 4; } // platformele au doar partea de sus

/* ================= FIZICĂ ================= */
function moveBody(b, dt, isPlayer) {
  // orizontal
  b.x += b.vx * dt;
  if (b.vx > 0) {
    const t1 = tileAt(b.x + b.w, b.y + 2), t2 = tileAt(b.x + b.w, b.y + b.h - 2);
    if (solidForBody(t1) || solidForBody(t2)) {
      b.x = Math.floor((b.x + b.w) / TILE) * TILE - b.w - 0.01;
      if (!isPlayer) b.vx = -b.vx; else b.vx = 0;
    }
  } else if (b.vx < 0) {
    const t1 = tileAt(b.x, b.y + 2), t2 = tileAt(b.x, b.y + b.h - 2);
    if (solidForBody(t1) || solidForBody(t2)) {
      b.x = (Math.floor(b.x / TILE) + 1) * TILE + 0.01;
      if (!isPlayer) b.vx = -b.vx; else b.vx = 0;
    }
  }
  // vertical
  b.vy += GRAV * dt;
  if (b.vy > 1200) b.vy = 1200;
  const oldBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.onGround = false;
  if (b.vy > 0) {
    const bottom = b.y + b.h;
    const t1 = tileAt(b.x + 4, bottom), t2 = tileAt(b.x + b.w - 4, bottom);
    const rowTop = Math.floor(bottom / TILE) * TILE;
    if ((solidTop(t1) || solidTop(t2)) &&
        (solidForBody(t1) || solidForBody(t2) || oldBottom <= rowTop + 1)) {
      b.y = rowTop - b.h;
      b.vy = 0;
      b.onGround = true;
    }
  } else if (b.vy < 0) {
    const t1 = tileAt(b.x + 4, b.y), t2 = tileAt(b.x + b.w - 4, b.y);
    if (solidForBody(t1) || solidForBody(t2)) {
      const r = Math.floor(b.y / TILE);
      b.y = (r + 1) * TILE + 0.01;
      b.vy = 0;
      if (isPlayer) hitBlockAbove(r, b);
    }
  }
}

function hitBlockAbove(r, b) {
  // lovim blocul de deasupra capului (Q dă monedă, B se scutură)
  const cMid = Math.floor((b.x + b.w/2) / TILE);
  for (const c of [cMid, Math.floor((b.x+4)/TILE), Math.floor((b.x+b.w-4)/TILE)]) {
    if (r >= 0 && grid[r] && grid[r][c] === 3) {
      grid[r][c] = 5; // bloc folosit
      score += 10;
      popups.push({ x:c*TILE+TILE/2, y:r*TILE, vy:-500, t:0.6 });
      sfx.coin();
      return;
    }
    if (r >= 0 && grid[r] && grid[r][c] === 2) { sfx.block(); return; }
  }
}

/* ================= UPDATE ================= */
function update(dt) {
  time += dt;
  stateTimer += dt;
  if (state !== 'play') { updateFX(dt); return; }

  const p = player;
  // mișcare
  if (inputLeft() && !inputRight())  { p.vx -= MOVE_ACC*dt; p.dir = -1; }
  else if (inputRight() && !inputLeft()) { p.vx += MOVE_ACC*dt; p.dir = 1; }
  else {
    if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION*dt);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION*dt);
  }
  p.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, p.vx));

  // săritură (cu coyote time + buffer, prietenos pentru copii)
  if (p.onGround) p.coyote = COYOTE; else p.coyote -= dt;
  if (jumpBufferT > 0) jumpBufferT -= dt;
  if (jumpBufferT > 0 && p.coyote > 0) {
    p.vy = -JUMP_V;
    p.coyote = 0; jumpBufferT = 0;
    sfx.jump();
  }
  // săritură mai mică dacă dai drumul repede
  if (p.vy < -300 && !(keys[' ']||keys['arrowup']||keys['w']||touchState.J)) p.vy = -300;

  moveBody(p, dt, true);
  if (Math.abs(p.vx) > 20 && p.onGround) p.anim += dt * 12; else if (p.onGround) p.anim = 0;
  if (p.invuln > 0) p.invuln -= dt;

  // cădere în gol
  if (p.y > H + 100) hurtPlayer(true);

  // monede
  for (const cn of coins) {
    if (cn.taken) continue;
    cn.anim += dt * 6;
    const cx = cn.c*TILE + TILE/2, cy = cn.r*TILE + TILE/2;
    if (Math.abs(p.x + p.w/2 - cx) < TILE*0.55 && Math.abs(p.y + p.h/2 - cy) < TILE*0.6) {
      cn.taken = true; score += 10; sfx.coin();
      for (let i=0;i<6;i++) particles.push({ x:cx, y:cy, vx:(Math.random()-0.5)*200, vy:-Math.random()*250, t:0.5, col:'#ffd700' });
    }
  }

  // inamici
  for (const en of enemies) {
    if (en.dead) { en.deadT -= dt; continue; }
    en.anim += dt * 8;
    // întoarce-te la margine de platformă
    const aheadX = en.vx < 0 ? en.x - 2 : en.x + en.w + 2;
    if (en.onGround && !solidTop(tileAt(aheadX, en.y + en.h + 4))) en.vx = -en.vx;
    moveBody(en, dt, false);
    if (en.y > H + 200) { en.dead = true; en.deadT = 0; continue; }
    // coliziune cu jucătorul
    if (rectHit(p, en)) {
      if (p.vy > 100 && p.y + p.h - en.y < 28) {
        en.dead = true; en.deadT = 0.5;
        p.vy = -JUMP_V * 0.55;
        score += 25; sfx.stomp();
        for (let i=0;i<8;i++) particles.push({ x:en.x+en.w/2, y:en.y+en.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*200, t:0.4, col:'#a05a2c' });
      } else if (p.invuln <= 0) {
        hurtPlayer(false);
      }
    }
  }
  enemies = enemies.filter(e => !e.dead || e.deadT > 0);

  // steag
  if (p.x + p.w/2 > flagX) {
    state = 'levelend'; stateTimer = 0;
    score += 100;
    sfx.flag();
  }

  // cameră
  const target = p.x - W*0.38;
  camX += (target - camX) * Math.min(1, dt*6);
  camX = Math.max(0, Math.min(camX, levelW*TILE - W));

  updateFX(dt);
}

function updateFX(dt) {
  for (const pt of particles) { pt.t -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += 800*dt; }
  particles = particles.filter(pt => pt.t > 0);
  for (const pp of popups) { pp.t -= dt; pp.y += pp.vy*dt; pp.vy += 1400*dt; }
  popups = popups.filter(pp => pp.t > 0);

  if (state === 'levelend' && stateTimer > 2.2) {
    levelIdx++;
    if (levelIdx >= LEVELS.length) { state = 'win'; stateTimer = 0; sfx.win(); }
    else { loadLevel(levelIdx); state = 'play'; }
  }
  if (state === 'dead' && stateTimer > 1.5) {
    if (lives <= 0) { lives = 3; }   // fără game over dur — o luăm de la capăt cu 3 vieți
    loadLevel(levelIdx);
    state = 'play';
    player.invuln = 2;
  }
}

function hurtPlayer(fell) {
  lives--;
  sfx.hurt();
  state = 'dead'; stateTimer = 0;
  const p = player;
  for (let i=0;i<10;i++) particles.push({ x:p.x+p.w/2, y:p.y+p.h/2, vx:(Math.random()-0.5)*300, vy:-Math.random()*300, t:0.6, col:CHARACTERS[charIdx].shirt });
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ================= DESEN ================= */
function draw() {
  // cer
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, '#5c94fc'); sky.addColorStop(1, '#9cc6ff');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  if (state === 'select') { drawSelect(); return; }

  drawClouds();
  drawHills();

  ctx.save();
  ctx.translate(-Math.floor(camX), 0);

  // tile-uri
  const c0 = Math.floor(camX/TILE), c1 = Math.min(levelW-1, c0 + Math.ceil(W/TILE) + 1);
  for (let r = 0; r < ROWS; r++) {
    for (let c = c0; c <= c1; c++) {
      drawTile(grid[r][c], c*TILE, r*TILE);
    }
  }

  drawFlag();

  // monede
  for (const cn of coins) {
    if (cn.taken) continue;
    drawCoin(cn.c*TILE + TILE/2, cn.r*TILE + TILE/2, cn.anim);
  }
  for (const pp of popups) drawCoin(pp.x, pp.y, time*10);

  // inamici
  for (const en of enemies) drawEnemy(en);

  // jucător
  if (state !== 'dead') {
    const p = player;
    if (!(p.invuln > 0 && Math.floor(time*12)%2===0)) {
      drawKid(p.x + p.w/2, p.y + p.h, CHARACTERS[charIdx], p.h, p.dir, p.anim, !p.onGround);
    }
  }

  // particule
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.t*2);
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x-4, pt.y-4, 8, 8);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  drawHUD();

  if (state === 'dead') drawOverlay(lives > 0 ? 'Ups! 😅 Mai încearcă!' : 'Nu-i nimic! 💪 O luăm de la capăt!', '');
  if (state === 'levelend') drawOverlay('Bravo! 🎉', levelIdx+1 < LEVELS.length ? 'Urmează: ' + LEVEL_NAMES[levelIdx+1] : 'Ai terminat totul!');
  if (state === 'win') drawWin();
}

function drawTile(t, x, y) {
  if (t === 0) return;
  if (t === 1) { // pământ
    ctx.fillStyle = '#c8824a'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#5cb85c'; ctx.fillRect(x, y, TILE, 10);
    ctx.fillStyle = '#8a5a30';
    ctx.fillRect(x+6, y+20, 8, 8); ctx.fillRect(x+28, y+32, 8, 8); ctx.fillRect(x+18, y+14, 6, 6);
  } else if (t === 2) { // cărămidă
    ctx.fillStyle = '#c0562a'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#7a3418'; ctx.lineWidth = 3;
    ctx.strokeRect(x+1.5, y+1.5, TILE-3, TILE-3);
    ctx.beginPath();
    ctx.moveTo(x, y+TILE/2); ctx.lineTo(x+TILE, y+TILE/2);
    ctx.moveTo(x+TILE/2, y); ctx.lineTo(x+TILE/2, y+TILE/2);
    ctx.moveTo(x+TILE/4, y+TILE/2); ctx.lineTo(x+TILE/4, y+TILE);
    ctx.moveTo(x+3*TILE/4, y+TILE/2); ctx.lineTo(x+3*TILE/4, y+TILE);
    ctx.stroke();
  } else if (t === 3) { // bloc ?
    const bounce = Math.sin(time*4) * 2;
    ctx.fillStyle = '#f8b800'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#9a6a00'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, TILE-4, TILE-4);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x + TILE/2, y + TILE/2 + bounce);
  } else if (t === 4) { // platformă
    ctx.fillStyle = '#2a9d3a'; ctx.fillRect(x, y, TILE, 14);
    ctx.fillStyle = '#1a7a28'; ctx.fillRect(x, y+10, TILE, 4);
  } else if (t === 5) { // bloc folosit
    ctx.fillStyle = '#9a7a4a'; ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#6a5230'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, TILE-4, TILE-4);
  }
}

function drawCoin(x, y, anim) {
  const sq = Math.abs(Math.sin(anim));
  const w = 12 * sq + 3;
  ctx.fillStyle = '#f8b800';
  ctx.beginPath(); ctx.ellipse(x, y, w, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.ellipse(x, y, w*0.55, 9, 0, 0, Math.PI*2); ctx.fill();
}

function drawEnemy(en) {
  const x = en.x, y = en.y, w = en.w, h = en.h;
  if (en.dead) { // turtit
    ctx.fillStyle = '#a05a2c';
    ctx.beginPath(); ctx.ellipse(x+w/2, y+h-8, w/2, 8, 0, 0, Math.PI*2); ctx.fill();
    return;
  }
  const wob = Math.sin(en.anim) * 2;
  // corp ciupercă supărată
  ctx.fillStyle = '#a05a2c';
  ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2+wob*0.3, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
  // picioare
  ctx.fillStyle = '#6a3a18';
  ctx.beginPath(); ctx.ellipse(x+10, y+h-4, 8, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w-10, y+h-4, 8, 6, 0, 0, Math.PI*2); ctx.fill();
  // ochi
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x+12, y+14+wob*0.3, 6, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w-12, y+14+wob*0.3, 6, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x+12, y+17+wob*0.3, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w-12, y+17+wob*0.3, 3, 0, Math.PI*2); ctx.fill();
  // sprâncene supărate
  ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x+6, y+6); ctx.lineTo(x+17, y+11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w-6, y+6); ctx.lineTo(x+w-17, y+11); ctx.stroke();
}

/* Desenul eroilor 🧒 — Antonia pe unicorn 🦄, Marc în mașinuță de poliție 🚓 */
function drawKid(cx, footY, cfg, h, dir, anim, jumping) {
  if (cfg.mount === 'unicorn') return drawUnicornRider(cx, footY, cfg, h, dir, anim, jumping);
  if (cfg.mount === 'police')  return drawPoliceRider(cx, footY, cfg, h, dir, anim, jumping);
  drawKidOnFoot(cx, footY, cfg, h, dir, anim, jumping);
}

function drawUnicornRider(cx, footY, cfg, h, dir, anim, jumping) {
  const u = h / 16;
  const g = jumping ? 1 : Math.sin(anim * Math.PI);   // galop
  ctx.save();
  ctx.translate(cx, footY);
  ctx.scale(dir, 1);

  const rainbow = ['#ff9fd0', '#b28dff', '#7fd4ff'];
  // coadă curcubeu
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = rainbow[i];
    ctx.lineWidth = 1.1*u;
    ctx.beginPath();
    ctx.moveTo(-4.4*u, -7.4*u + i*0.5*u);
    ctx.quadraticCurveTo(-6.6*u, -7*u + i*0.6*u, -6.1*u, -4.4*u + i*0.7*u);
    ctx.stroke();
  }

  // picioare unicorn (galop)
  const f = jumping ? 1.6 : g, b = jumping ? -1.6 : -g;
  ctx.fillStyle = '#f6f3ee';
  ctx.fillRect(2.2*u + f*0.7*u, -5*u, 1.3*u, 5*u);
  ctx.fillRect(0.8*u - f*0.5*u, -5*u, 1.3*u, 5*u);
  ctx.fillRect(-2.6*u + b*0.5*u, -5*u, 1.3*u, 5*u);
  ctx.fillRect(-4.2*u - b*0.6*u, -5*u, 1.3*u, 5*u);
  ctx.fillStyle = '#d9b3e6';   // copite
  ctx.fillRect(2.2*u + f*0.7*u, -1*u, 1.3*u, 1*u);
  ctx.fillRect(0.8*u - f*0.5*u, -1*u, 1.3*u, 1*u);
  ctx.fillRect(-2.6*u + b*0.5*u, -1*u, 1.3*u, 1*u);
  ctx.fillRect(-4.2*u - b*0.6*u, -1*u, 1.3*u, 1*u);

  // corp + gât + cap
  ctx.fillStyle = '#fdfbf7';
  ctx.beginPath(); ctx.ellipse(-0.4*u, -6.6*u, 4.6*u, 2.4*u, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2.4*u, -7.5*u); ctx.lineTo(4.4*u, -11.8*u);
  ctx.lineTo(5.6*u, -11.2*u); ctx.lineTo(4*u, -6.2*u);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5.2*u, -11.6*u, 1.7*u, 1.2*u, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f6c8d8';   // bot roz
  ctx.beginPath(); ctx.ellipse(6.3*u, -11.3*u, 0.8*u, 0.7*u, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';      // ochi
  ctx.beginPath(); ctx.arc(5*u, -11.9*u, 0.32*u, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffd23f';   // corn auriu
  ctx.beginPath(); ctx.moveTo(4.5*u, -12.5*u); ctx.lineTo(5.5*u, -12.3*u); ctx.lineTo(5.6*u, -15.2*u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fdfbf7';   // ureche
  ctx.beginPath(); ctx.moveTo(3.9*u, -12.5*u); ctx.lineTo(4.4*u, -13.5*u); ctx.lineTo(4.8*u, -12.4*u); ctx.closePath(); ctx.fill();
  // coamă curcubeu
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = rainbow[i];
    ctx.lineWidth = 0.75*u;
    ctx.beginPath();
    ctx.moveTo(4.2*u - i*0.62*u, -12.3*u + i*0.28*u);
    ctx.lineTo(2.5*u - i*0.62*u, -7.6*u + i*0.2*u);
    ctx.stroke();
  }

  // Antonia — picior pe partea vizibilă
  ctx.fillStyle = cfg.pants;
  ctx.fillRect(-0.2*u, -8.2*u, 1.5*u, 3.2*u);
  ctx.fillStyle = cfg.shoes;
  ctx.fillRect(-0.35*u, -5.4*u, 1.8*u, 1.1*u);
  // corp + braț spre coamă
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-2.2*u, -13*u, 3.6*u, 4.9*u);
  ctx.fillRect(0.9*u, -12.6*u, 2.2*u, 1.2*u);
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(2.9*u, -12.8*u, 1.2*u, 1.4*u);
  // cap + păr blond lung
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-2.6*u, -18.2*u, 4.6*u, 5.3*u);
  ctx.fillStyle = cfg.hairColor;
  ctx.fillRect(-3.4*u, -18*u, 1.2*u, 7.2*u);      // păr pe spate
  ctx.fillRect(-2.9*u, -18.6*u, 5.2*u, 1.6*u);    // calotă
  // bentiță roz cu urechi de pisică 🐱
  ctx.fillStyle = '#ff8fb5';
  ctx.fillRect(-2.9*u, -19*u, 5.2*u, 0.8*u);
  ctx.beginPath(); ctx.moveTo(-2.4*u, -18.8*u); ctx.lineTo(-1.6*u, -20.7*u); ctx.lineTo(-0.6*u, -18.9*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.6*u, -18.9*u); ctx.lineTo(1.5*u, -20.7*u); ctx.lineTo(2.3*u, -18.8*u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffc2d6';
  ctx.beginPath(); ctx.moveTo(-2*u, -19*u); ctx.lineTo(-1.6*u, -20.1*u); ctx.lineTo(-1*u, -19*u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1*u, -19*u); ctx.lineTo(1.5*u, -20.1*u); ctx.lineTo(1.9*u, -19*u); ctx.closePath(); ctx.fill();
  // față
  ctx.fillStyle = '#222';
  ctx.fillRect(-0.4*u, -16.4*u, 0.8*u, 1*u);
  ctx.fillRect(1*u, -16.4*u, 0.8*u, 1*u);
  ctx.fillStyle = '#c96b5c';
  ctx.fillRect(0.15*u, -14.4*u, 0.95*u, 0.38*u);
  ctx.restore();
}

function drawPoliceRider(cx, footY, cfg, h, dir, anim, jumping) {
  const u = h / 16;
  const bob = jumping ? -0.4 : Math.sin(anim * 2) * 0.25;
  const flash = Math.floor(time * 5) % 2;
  ctx.save();
  ctx.translate(cx, footY + bob*u);
  ctx.scale(dir, 1);

  // roți
  for (const wx of [-3.4, 3.4]) {
    ctx.fillStyle = '#22262a';
    ctx.beginPath(); ctx.arc(wx*u, -1.5*u, 1.5*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9aa3ab';
    ctx.beginPath(); ctx.arc(wx*u, -1.5*u, 0.65*u, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#556'; ctx.lineWidth = 0.25*u;
    ctx.beginPath();
    ctx.moveTo(wx*u - Math.cos(anim*2)*0.6*u, -1.5*u - Math.sin(anim*2)*0.6*u);
    ctx.lineTo(wx*u + Math.cos(anim*2)*0.6*u, -1.5*u + Math.sin(anim*2)*0.6*u);
    ctx.stroke();
  }

  // caroserie albastră cu dungă albă
  ctx.fillStyle = '#2255cc';
  roundRect(-5.4*u, -5.6*u, 10.8*u, 4.4*u, 0.9*u); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-5.4*u, -4.3*u, 10.8*u, 1.3*u);
  ctx.fillStyle = '#2255cc';
  ctx.fillRect(-2.4*u, -4.1*u, 0.5*u, 0.9*u);   // "POLICE" sugerat prin liniuțe
  ctx.fillRect(-1.5*u, -4.1*u, 0.5*u, 0.9*u);
  ctx.fillRect(-0.6*u, -4.1*u, 0.5*u, 0.9*u);
  ctx.fillRect(0.3*u, -4.1*u, 0.5*u, 0.9*u);
  // capotă față + parbriz
  ctx.fillStyle = '#1c47ab';
  roundRect(2.6*u, -6.4*u, 2.8*u, 1.2*u, 0.4*u); ctx.fill();
  ctx.fillStyle = '#bfe4ff';
  ctx.beginPath();
  ctx.moveTo(2.4*u, -5.7*u); ctx.lineTo(3*u, -7.2*u);
  ctx.lineTo(4.1*u, -7.2*u); ctx.lineTo(3.6*u, -5.7*u);
  ctx.closePath(); ctx.fill();
  // girofar 🚨 (clipește roșu/albastru)
  ctx.fillStyle = '#ddd';
  ctx.fillRect(3.5*u, -7.2*u, 1.6*u, 0.5*u);
  ctx.fillStyle = flash ? '#ff3b30' : '#3b82ff';
  ctx.fillRect(3.5*u, -8*u, 0.8*u, 0.8*u);
  ctx.fillStyle = flash ? '#3b82ff' : '#ff3b30';
  ctx.fillRect(4.3*u, -8*u, 0.8*u, 0.8*u);
  // far
  ctx.fillStyle = '#ffe27a';
  ctx.fillRect(5*u, -5.4*u, 0.5*u, 0.9*u);

  // Marc la volan 🧒
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-2.3*u, -10*u, 3.6*u, 4.6*u);      // corp
  ctx.fillRect(0.7*u, -9.6*u, 1.8*u, 1.1*u);      // braț
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(2.2*u, -9.8*u, 1.1*u, 1.3*u);      // mână
  ctx.strokeStyle = '#22262a'; ctx.lineWidth = 0.35*u;   // volan
  ctx.beginPath(); ctx.arc(2.6*u, -8.2*u, 0.95*u, 0, Math.PI*2); ctx.stroke();
  // cap
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-2.7*u, -15*u, 4.6*u, 5.2*u);
  // păr șaten ciufulit
  ctx.fillStyle = cfg.hairColor;
  ctx.fillRect(-3*u, -15.6*u, 5.2*u, 1.8*u);
  ctx.fillRect(-2.6*u, -16.3*u, 1.3*u, 1*u);
  ctx.fillRect(-0.6*u, -16.6*u, 1.4*u, 1.3*u);
  ctx.fillRect(1.2*u, -16.2*u, 1.1*u, 1*u);
  ctx.fillRect(-3*u, -14*u, 0.8*u, 1.4*u);
  // ochi
  ctx.fillStyle = '#222';
  ctx.fillRect(-0.6*u, -13.3*u, 0.8*u, 1*u);
  ctx.fillRect(0.9*u, -13.3*u, 0.8*u, 1*u);
  // ochelari rotunzi 👓
  ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 0.3*u;
  ctx.beginPath(); ctx.arc(-0.2*u, -12.9*u, 0.95*u, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(1.3*u, -12.9*u, 0.95*u, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.55*u, -13.1*u); ctx.lineTo(0.55*u, -12.9*u);
  ctx.moveTo(-1.15*u, -13*u); ctx.lineTo(-1.9*u, -13.3*u); ctx.stroke();
  // zâmbet
  ctx.fillStyle = '#c96b5c';
  ctx.fillRect(0.05*u, -11.1*u, 0.95*u, 0.38*u);
  ctx.restore();
}

function drawKidOnFoot(cx, footY, cfg, h, dir, anim, jumping) {
  const u = h / 16;             // unitate de desen
  const legSwing = jumping ? 0.8 : Math.sin(anim * Math.PI) * 0.9;
  ctx.save();
  ctx.translate(cx, footY);
  ctx.scale(dir, 1);

  // picioare (pantaloni + pantofi)
  ctx.fillStyle = cfg.pants;
  ctx.fillRect(-2.6*u + legSwing*u, -5*u, 2.2*u, 3.6*u);   // picior spate
  ctx.fillRect(0.4*u - legSwing*u, -5*u, 2.2*u, 3.6*u);    // picior față
  ctx.fillStyle = cfg.shoes;
  ctx.fillRect(-2.8*u + legSwing*u, -1.6*u, 2.8*u, 1.6*u);
  ctx.fillRect(0.2*u - legSwing*u, -1.6*u, 2.8*u, 1.6*u);

  // corp (tricou)
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(-3*u, -10*u, 6*u, 5.4*u);
  // braț
  const armSwing = jumping ? -1.5 : Math.sin(anim * Math.PI + Math.PI) * 0.8;
  ctx.fillStyle = cfg.shirt;
  ctx.fillRect(2.6*u, -10*u, 1.6*u, 3*u);
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(2.6*u, -7.2*u + armSwing*u*0.5, 1.6*u, 1.6*u);

  // cap
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(-3.2*u, -16*u, 6.4*u, 6.2*u);
  // păr
  ctx.fillStyle = cfg.hairColor;
  if (cfg.hair === 'codite') {
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 2.4*u);
    ctx.fillRect(-4.6*u, -15*u, 1.4*u, 4.5*u);   // codiță
    ctx.fillRect(3.2*u, -15*u, 1.4*u, 4.5*u);
    ctx.fillStyle = '#e63985';
    ctx.fillRect(-4.6*u, -11*u, 1.4*u, 0.8*u); ctx.fillRect(3.2*u, -11*u, 1.4*u, 0.8*u);
  } else if (cfg.hair === 'ciufulit') {
    ctx.fillRect(-3.6*u, -16.8*u, 7.2*u, 2.2*u);
    ctx.fillRect(-3.2*u, -17.6*u, 1.6*u, 1.2*u);
    ctx.fillRect(-0.6*u, -18*u, 1.6*u, 1.6*u);
    ctx.fillRect(1.8*u, -17.4*u, 1.4*u, 1.2*u);
    ctx.fillRect(-3.6*u, -15*u, 1*u, 2*u);
  } else if (cfg.hair === 'breton') {
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 3.2*u);
    ctx.fillRect(-3.6*u, -14*u, 1.2*u, 3*u);
    ctx.fillRect(2.4*u, -14*u, 1.2*u, 3*u);
  } else { // scurt
    ctx.fillRect(-3.6*u, -16.6*u, 7.2*u, 2.2*u);
    ctx.fillRect(-3.6*u, -15*u, 1*u, 1.6*u);
  }

  // față (privind în direcția de mers)
  ctx.fillStyle = '#222';
  ctx.fillRect(0.4*u, -13.6*u, 1*u, 1.3*u);     // ochi
  ctx.fillRect(2.2*u, -13.6*u, 1*u, 1.3*u);
  ctx.fillStyle = '#d8886a';
  ctx.fillRect(1.4*u, -12*u, 0.8*u, 0.8*u);     // nas
  ctx.fillStyle = '#b84a3a';
  ctx.fillRect(0.8*u, -10.9*u, 1.8*u, 0.6*u);   // zâmbet

  ctx.restore();
}

function drawFlag() {
  const x = flagX;
  const groundY = 11 * TILE;
  ctx.fillStyle = '#3aa03a';
  ctx.fillRect(x-4, groundY - TILE*6, 8, TILE*6);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(x, groundY - TILE*6, 10, 0, Math.PI*2); ctx.fill();
  const wave = Math.sin(time*3)*6;
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(x+4, groundY - TILE*6 + 10);
  ctx.lineTo(x+4 + 60, groundY - TILE*6 + 30 + wave);
  ctx.lineTo(x+4, groundY - TILE*6 + 50);
  ctx.closePath(); ctx.fill();
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 420 + 100 - camX*0.3) % (W + 400)) - 200;
    const cy = 60 + (i%3)*55;
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI*2);
    ctx.arc(cx+30, cy-8, 32, 0, Math.PI*2);
    ctx.arc(cx+62, cy, 26, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawHills() {
  ctx.fillStyle = '#7ec850';
  for (let i = 0; i < 5; i++) {
    const hx = ((i * 500 + 50 - camX*0.5) % (W + 600)) - 300;
    ctx.beginPath();
    ctx.arc(hx, H - 24, 130, Math.PI, 0);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  roundRect(12, 12, 1000, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px "Segoe UI", Arial';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('⭐ ' + score, 32, 39);
  ctx.fillText('❤️'.repeat(Math.max(0,lives)), 200, 39);
  ctx.textAlign = 'center';
  ctx.fillText(LEVEL_NAMES[Math.min(levelIdx, LEVEL_NAMES.length-1)], W/2, 39);

function drawWin() {

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 64px "Segoe UI", Arial';

  ctx.fillText('🏆 AI CÂȘTIGAT! 🏆', W/2, H/2 - 80);
  ctx.font = 'bold 40px "Segoe UI", Arial';
  ctx.fillStyle = '#fff';

}

function drawSelect() {
  drawClouds(); drawHills();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 58px "Segoe UI", Arial';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 8;
  ctx.strokeText('🍄 Super Aventura 🍄', W/2, 90);
  ctx.fillText('🍄 Super Aventura 🍄', W/2, 90);
  ctx.font = '30px "Segoe UI", Arial';
  ctx.fillText('Cine se joacă? 😊', W/2, 160);

  for (let i = 0; i < 2; i++) {
    const cfg = CHARACTERS[i];
    const bx = i === 0 ? W/4 : 3*W/4;
    const sel = selHover === i;
    ctx.fillStyle = sel ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.55)';
    roundRect(bx - 160, 200, 320, 280, 24); ctx.fill();
    if (sel) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6;
      roundRect(bx - 160, 200, 320, 280, 24); ctx.stroke();
    }
    const bob = sel ? Math.sin(time*5)*5 : 0;
    drawKid(bx, 420 + bob, cfg, 130 * cfg.scale, 1, sel ? time*6 : 0, false);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 30px "Segoe UI", Arial';
    ctx.fillText(cfg.name, bx, 250);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '24px "Segoe UI", Arial';
  ctx.fillText('⬅➡ alege  •  Enter / atinge ca să pornești', W/2, 530);
  ctx.fillText('🕹️ Săgeți sau A/D = mers  •  Spațiu / ⬆ = săritură', W/2, 30);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ================= BUCLA ================= */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
